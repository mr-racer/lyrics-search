            <div style={{ display:'flex', alignItems:'flex-end', justifyContent:'space-between', marginBottom:'18px', gap:'12px', flexWrap:'wrap' }}>
              <div>
                <div className="mono" style={{ fontSize:'14px', color:c.textSubtle, letterSpacing:'0.22em', marginBottom:'6px' }}>
                  {lang==='ru'?'CLAP-ПАРЫ':'CLAP PAIRS'}
                </div>
                <div className="serif" style={{ fontSize:'26px', lineHeight:'1', letterSpacing:'-0.02em', color:c.text }}>
                  {lang==='ru'?'Звуковое':'Sonic'}<i style={{ color:'oklch(62% 0.2 275)' }}> {lang==='ru'?'родство':'kinship'}</i>
                </div>

                  { value:'dissimilar', label:lang==='ru'?'РАЗНЫЕ ≠':'DIFFERENT ≠' },

            {(() => {
              if (topPairsLoading) {
                return <div style={{ display:'flex', flexDirection:'column', gap:'10px' }}>

                    <div key={i} style={{ height:'70px', borderRadius:'14px',

                      animation:`pulse 1.4s ${i*0.1}s ease-in-out infinite` }} />
                  ))}
                </div>;
              }
              const pairs = topPairs?.[activePairsTab] || [];
              const top = pairs
                .map(p => ({ main:p, best: p[`top_${activePairsTab}`]?.[0] }))
                .filter(x => x.best)
                .sort((a,b) => activePairsTab === 'similar' ? b.best.score - a.best.score : a.best.score - b.best.score);
              const seen = new Set();
              const top5 = [];
              for (const item of top) {
                const a = item.main.track_id || item.main.song;
                const b = item.best.track_id || item.best.name;
                const k = a < b ? `${a}|${b}` : `${b}|${a}`;
                if (seen.has(k)) continue;
                seen.add(k); top5.push(item);
                if (top5.length === 5) break;
              }

              if (top5.length === 0) {
                return <div className="serif" style={{ fontSize:'15px', color:c.textSubtle, fontStyle:'italic', textAlign:'center', padding:'40px' }}>
                  {lang==='ru'?'Данные ещё не рассчитаны':'Data not computed yet'}
                </div>;
              }

              return (
                <div style={{ display:'flex', flexDirection:'column' }}>
                  {top5.map((pair, idx) => {
                    const score = pair.best.score || 0;
                    const display = activePairsTab === 'similar' ? score : Math.max(0, 100 - score);
                    const meterPct = Math.max(3, Math.min(100, display));
                    const hue = activePairsTab === 'similar' ? 270 : 25;
                    const accent = `oklch(62% 0.18 ${hue})`;
                    const [aA, aT] = (pair.main.song || '').split(' - ').length===2 ? pair.main.song.split(' - ') : ['—', pair.main.song];
                    const [bA, bT] = (pair.best.name || '').split(' - ').length===2 ? pair.best.name.split(' - ') : ['—', pair.best.name];
                    return (
                      <div key={idx} style={{
                        display:'grid', gridTemplateColumns:'24px 60px 1fr 100px',
                        alignItems:'center', gap:'14px',
                        padding:'14px 0',
                        borderTop: idx > 0 ? `1px solid ${c.border}` : 'none',
                        animation:`fadeIn 0.4s ease ${idx*0.05}s both`,
                      }}>
                        <span className="mono" style={{ fontSize:'14px', color:c.textSubtle, letterSpacing:'0.06em' }}>{String(idx+1).padStart(2,'0')}</span>
                        <div style={{ display:'flex', position:'relative' }}>
                          <AlbumCover title={aT} artist={aA} size={36} isDark={isDark} coverPath={pair.main.cover_art_path} />
                          <div style={{ marginLeft:'-12px' }}>
                            <AlbumCover title={bT} artist={bA} size={36} isDark={isDark} coverPath={pair.best.cover_art_path} />
                          </div>
                        </div>
                        <div style={{ minWidth:0 }}>
                          <div style={{ fontSize:'15px', color:c.text, fontWeight:'500', whiteSpace:'nowrap', overflow:'hidden', textOverflow:'ellipsis' }}>
                            {aT} <span style={{ color: accent }}>↔</span> {bT}
                          </div>
                          <div className="serif" style={{ fontSize:'14px', color:c.textMuted, fontStyle:'italic', whiteSpace:'nowrap', overflow:'hidden', textOverflow:'ellipsis', marginTop:'2px' }}>
                            {aA} · {bA}
                          </div>
                        </div>
                        <div style={{ display:'flex', flexDirection:'column', alignItems:'flex-end', gap:'5px' }}>
                          <span className="mono" style={{ fontSize:'14px', color: accent, letterSpacing:'0.04em' }}>{display.toFixed(1)}%</span>
                          <div className={ske('inset', isDark)} style={{ width:'80px', height:'4px', borderRadius:'3px', overflow:'hidden' }}>
                            <div style={{ width:`${meterPct}%`, height:'100%',
                              background:`linear-gradient(90deg, ${accent}, ${accent.replace(')', ' / 0.5)')})`,
                              boxShadow:`0 0 6px ${accent.replace(')', ' / 0.4)')}`,
                              transform:'scaleX(0)', transformOrigin:'left',
                              animation:`meterTick 0.8s cubic-bezier(.22,.9,.3,1) ${idx*0.07}s forwards` }} />
                          </div>
                        </div>
                      </div>
                    );
                  })}
                </div>
              );
            })()}
          </div>

        </div>
      </div>
    </div>
  );
}

// ─── Indexing progress (compact, 2 sections) ─────────────────────────────────
function IndexingProgress({ stepStatus, stageProgress, lang, c, isDark }) {
  const internetStages = [
    { key:'lyrics',   icon:'♪', labelRu:'Тексты',         labelEn:'Lyrics' },
    { key:'facts',    icon:'★', labelRu:'Факты',         labelEn:'Facts' },
    { key:'metadata', icon:'⌕', labelRu:'Метаданные',    labelEn:'Metadata' },
  ];
  const localStages = [
    { key:'dense',    icon:'◆', labelRu:'Dense эмбеддинги', labelEn:'Dense embeddings' },
    { key:'audio',    icon:'♫', labelRu:'CLAP аудио',     labelEn:'CLAP audio' },
  ];
  const finalStages = [
    { key:'analysis', icon:'∿', labelRu:'Анализ схожести', labelEn:'Similarity analysis' },
  ];

  const CheckIcon = ({ size=16, color }) => (
    <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke={color} strokeWidth="3" strokeLinecap="round" strokeLinejoin="round">
      <path d="M4 12l6 6L20 6"/>
    </svg>
  );

  useEffect(() => {
    let styleEl = document.getElementById('indexing-pulse-style');
    if (!styleEl) {
      styleEl = document.createElement('style');
      styleEl.id = 'indexing-pulse-style';
      document.head.appendChild(styleEl);
    }
    styleEl.textContent = '@keyframes indexing-pulse { 0%,100%{opacity:0.4;transform:scale(0.8)} 50%{opacity:1;transform:scale(1)} }';
  }, [isDark]);

  const renderSection = (header, stages) => (
    <div style={{ display:'flex', flexDirection:'column', gap:'14px' }}>
      {header && (
        <div className="mono" style={{
          fontSize:'12px', color: c.textSubtle, letterSpacing:'0.22em',
          paddingBottom:'6px', marginBottom:'2px',
          borderBottom: `1px solid ${isDark ? 'rgba(255,255,255,0.06)' : 'rgba(0,0,0,0.08)'}`,
        }}>
          {header}
        </div>
      )}
      {stages.map(s => {
        const status = stepStatus[s.key] || 'pending';
        const active = status === 'running';
        const done = status === 'done' || status === 'completed';
        const fail = status === 'failed';
        const partial = status === 'partial';
        const accent = done ? c.green : fail ? c.red : partial ? c.amber : active ? c.amber : c.textSubtle;
        const prog = stageProgress && stageProgress[s.key];
        const pct = prog && prog.total && prog.total > 0 ? Math.max(0, Math.min(100, ((prog.current || 0) / prog.total) * 100)) : 0;
        const etaText = prog && prog.eta != null && prog.eta > 0 ? ` · ETA ${Math.round(prog.eta)}s` : '';
        const labelText = prog && prog.total != null
          ? `${prog.current || 0}/${prog.total}`
          : null;

        // Icon background
        let iconBg;
        if (done) iconBg = c.greenBg;
        else if (fail) iconBg = c.redBg;
        else if (active) iconBg = `oklch(72% 0.13 75 / 0.12)`;
        else iconBg = isDark ? 'rgba(255,255,255,0.04)' : 'rgba(0,0,0,0.04)';

        return (
          <div key={s.key} style={{ display:'flex', alignItems:'flex-start', gap:'12px' }}>
            <div style={{
              width:'35px', height:'35px', borderRadius:'10px', flexShrink:0, marginTop:'2px',
              display:'flex', alignItems:'center', justifyContent:'center',
              fontSize:'17px', color: accent, fontFamily:"'JetBrains Mono', monospace",
              background: iconBg,
              boxShadow: isDark ? 'inset 0 1px 0 rgba(255,255,255,0.05)' : 'inset 0 1px 0 rgba(255,255,255,0.85)',
            }}>
              {done ? <CheckIcon size={18} color={accent} />
                : fail ? '×'
                : active ? (
                    <span style={{
                      width:'10px', height:'10px', borderRadius:'50%',
                      background: accent,
                      animation: 'indexing-pulse 1.2s ease-in-out infinite',
                    }} />
                  )
                : s.icon}
            </div>
            <div style={{ flex:1, minWidth:0 }}>
              <div style={{ fontSize:'17px', color: c.text, fontWeight: active?'600':'500' }}>
                {lang==='ru' ? s.labelRu : s.labelEn}
              </div>
              {(active || done || partial || fail) && (
                <div style={{ display:'flex', flexDirection:'column', gap:'5px', marginTop:'6px' }}>
                  {active && (
                    <div>
                      <div style={{
                        height:'5px', borderRadius:'3px', overflow:'hidden', marginBottom:'4px',
                        background: isDark ? 'rgba(255,255,255,0.06)' : 'rgba(0,0,0,0.06)',
                      }}>
                        <div style={{
                          height:'100%', width:`${pct}%`, borderRadius:'3px',
                          background: `linear-gradient(90deg, oklch(60% 0.18 270), oklch(68% 0.2 290))`,
                          transition: 'width 0.5s ease-out',
                          boxShadow: `0 0 6px oklch(60% 0.18 270 / 0.4)`,
                        }} />
                      </div>
                      {labelText && (
                        <div className="mono" style={{ fontSize:'12px', color:c.textMuted, letterSpacing:'0.06em' }}>
                          {labelText}{etaText}
                          {prog && prog.found != null && prog.not_found != null && (
                            <span>
                              {' '}· <span style={{ color: c.green }}>{prog.found} {lang==='ru'?'найдено':'found'}</span>
                              {prog.not_found > 0 && <span>, {prog.not_found} <span style={{ color: c.amber }}>{lang==='ru'?'не найдено':'not found'}</span></span>}
                            </span>
                          )}
                        </div>
                      )}
                    </div>
                  )}
                  {done && (
                    <div className="mono" style={{ fontSize:'12px', color:c.green, letterSpacing:'0.06em' }}>
                      {prog && prog.message ? prog.message : (lang==='ru'?'Готово':'Done')}
                    </div>
                  )}
                  {partial && (
                    <div className="mono" style={{ fontSize:'12px', color:c.amber, letterSpacing:'0.06em' }}>
                      {prog && prog.message ? prog.message : ''}
                    </div>
                  )}
                  {fail && (
                    <div className="mono" style={{ fontSize:'12px', color:c.red, letterSpacing:'0.06em' }}>
                      {prog && prog.message ? prog.message : (lang==='ru'?'Ошибка':'Error')}
                    </div>
                  )}
                </div>
              )}
            </div>
          </div>
        );
      })}
    </div>
  );

  const grooveStyle = {
    padding: '6px 0',
    borderTop: `1px solid ${isDark ? 'rgba(255,255,255,0.07)' : 'rgba(0,0,0,0.09)'}`,
    borderBottom: `1px solid ${isDark ? 'rgba(255,255,255,0.025)' : 'rgba(0,0,0,0.04)'}`,
  };

  return (
    <div style={{ display:'flex', flexDirection:'column', gap:'14px' }}>
      {renderSection(
        lang==='ru' ? 'ПОИСК ДАННЫХ В ИНТЕРНЕТЕ' : 'FETCHING DATA',
        internetStages
      )}
      <div style={grooveStyle} />
      {renderSection(
        lang==='ru' ? 'ЛОКАЛЬНАЯ ИНДЕКСАЦИЯ' : 'LOCAL INDEXING',
        localStages
      )}
      {renderSection(null, finalStages)}
    </div>
  );
}

  );
}

// ─── Settings overlay (slides in from right) ─────────────────────────────────
function SettingsPanel({ isDark, lang, onClose, onCollectionsUpdate, activeCollection }) {
  const c = useColors(isDark);
  const [models, setModels] = useState({});
  const [textModel, setTextModel] = useState(() => localStorage.getItem('text_model') || 'jinaai/jina-embeddings-v2-small-en');
  const [collName, setCollName] = useState('');
  const [folderPath, setFolderPath] = useState('');
  const [picking, setPicking] = useState(false);
  const [betterLyrics, setBetterLyrics] = useState(false);
  const [refineMetadata, setRefineMetadata] = useState(false);
  const [indexing, setIndexing] = useState(false);
  const [stepStatus, setStepStatus] = useState({});
  const [showModal, setShowModal] = useState(false);
  const [modalTrackCount, setModalTrackCount] = useState(null);
  const [modalError, setModalError] = useState(null);
  const [stageProgress, setStageProgress] = useState({});

  const [llmBaseUrl, setLlmBaseUrl] = useState(() => localStorage.getItem('llm_base_url') || '');
  const [llmModel, setLlmModel] = useState(() => localStorage.getItem('llm_model') || '');
  const [llmSaved, setLlmSaved] = useState(false);

  useEffect(() => {
    apiFetch('/search/models/text').then(setModels).catch(() => {});
  }, []);

  useEffect(() => { localStorage.setItem('text_model', textModel); }, [textModel]);

  const handlePick = async () => {
    setPicking(true);
    try { const res = await apiFetch('/library/pick-folder'); if (res.path) setFolderPath(res.path); }
    catch {} finally { setPicking(false); }
  };

  const handleIndex = async () => {
    if (!folderPath.trim() || indexing) return;
    const colName = collName.trim() || 'my_collection';
    setIndexing(true); setModalError(null); setModalTrackCount(null); setStageProgress({}); setShowModal(true);
    setStepStatus({ lyrics:'idle', facts:'idle', metadata:'idle', dense:'idle', audio:'idle', analysis:'idle' });
    try {
      const res = await apiFetch('/library/index', { method:'POST',
        body: JSON.stringify({ folder_path:folderPath, collection_name:colName, better_lyrics_quality:betterLyrics, text_model:textModel, enhance_by_musicbrainz:refineMetadata }) });
      if (res.status === 'failed') { setModalError(res.message); setIndexing(false); return; }
      if (!res.job_id) {
        setStepStatus({ metadata:'done', lyrics:'done', audio:'done', analysis:'done' });
        setModalTrackCount(res.count || 0);
        localStorage.setItem('active_collection', colName);
        onCollectionsUpdate && onCollectionsUpdate();
        return;
      }
      const evt = new EventSource(`${API}/index/progress/${res.job_id}`);
      evt.onmessage = (event) => {
        try {
          const data = JSON.parse(event.data);
          if (data.stages) {
            const statusMap = { completed: 'done', failed: 'failed', running: 'running', pending: 'pending' };
            setStepStatus(prev => {
              const newStatus = { ...prev };
              for (const [key, stage] of Object.entries(data.stages)) {
                newStatus[key] = (statusMap[stage.status] || stage.status) || 'pending';
              }
              return newStatus;
            });
            // Merge event-specific fields into the correct stage
            if (data.stage && data.stages[data.stage]) {
              const ev = data.stages[data.stage];
              if (data.current !== undefined) ev.current = data.current;
              if (data.total !== undefined) ev.total = data.total;
              if (data.eta_seconds !== undefined) ev.eta_seconds = data.eta_seconds;
              if (data.message !== undefined) ev.message = data.message;
            }
            setStageProgress(prev => {
              const newProg = { ...prev };
              for (const [key, stage] of Object.entries(data.stages)) {
                newProg[key] = {
                  current: stage.current ?? prev[key]?.current ?? 0,
                  total: stage.total ?? prev[key]?.total ?? 0,
                  eta: stage.eta_seconds ?? prev[key]?.eta ?? null,
                  message: stage.message ?? prev[key]?.message ?? null,
                  found: stage.found ?? prev[key]?.found ?? null,
                  not_found: stage.not_found ?? prev[key]?.not_found ?? null,
                };
              }
              return newProg;
            });
          }
          if (data.overall_status === 'completed') {
            evt.close();
            setStepStatus(prev => ({ ...prev, ...Object.fromEntries(
              Object.keys(prev).filter(k => prev[k] === 'pending').map(k => [k, 'done'])
            )}));
            setModalTrackCount(data.stages?.lyrics?.current || data.stages?.metadata?.current || 0);
            setIndexing(false);
            localStorage.setItem('active_collection', colName);
            onCollectionsUpdate && onCollectionsUpdate();
          } else if (data.overall_status === 'failed') {
            evt.close();
            setModalError(data.error || data.message);
            setIndexing(false);
          }
        } catch {}
      };
      evt.onerror = () => { evt.close(); if (indexing) { setModalError(lang==='ru'?'Соединение потеряно':'Connection lost'); setIndexing(false); } };
    } catch (e) { setModalError(e.message); setIndexing(false); }
  };

  const saveLLM = () => {
    localStorage.setItem('llm_base_url', llmBaseUrl.trim());
    localStorage.setItem('llm_model',    llmModel.trim());
    setLlmSaved(true); setTimeout(() => setLlmSaved(false), 2000);
  };

  const fieldLabel = (text) => (
    <div className="mono" style={{ fontSize:'14px', color:c.textSubtle, letterSpacing:'0.22em', marginBottom:'7px' }}>{text}</div>
  );
  const inputClass = ske('inset', isDark);
  const inputStyle = {
    width:'100%', padding:'10px 13px', borderRadius:'10px', border:'none',
    color: c.text, fontSize:'15px', outline:'none', fontFamily:"'JetBrains Mono', monospace",
  };
  const card = (children) => (
    <div className={ske('panel', isDark)} style={{ padding:'22px 24px', borderRadius:'16px' }}>{children}</div>
  );

  return (
    <>
      <div onClick={onClose} style={{
        position:'fixed', inset:0, zIndex:90,
        background: isDark ? 'rgba(0,0,0,0.5)' : 'rgba(40,30,60,0.25)',
        backdropFilter:'blur(4px)',
        animation:'fadeIn 0.2s ease',
      }} />
      <div className={`${ske('panel', isDark)} grain`} style={{
        position:'fixed', top:0, right:0, bottom:0, zIndex:91,
        width:'min(540px, 92vw)', display:'flex', flexDirection:'column',
        borderRadius:'0', overflow:'hidden',
        animation:'slideRight 0.32s cubic-bezier(.22,.9,.3,1)',
      }}>
        <div style={{ padding:'24px 28px 18px', borderBottom:`1px solid ${c.border}`, display:'flex', alignItems:'center', justifyContent:'space-between' }}>
          <div>
            <div className="mono" style={{ fontSize:'14px', color:c.textSubtle, letterSpacing:'0.22em', marginBottom:'6px' }}>
              {lang==='ru'?'НАСТРОЙКИ':'SETTINGS'}
            </div>
            <div className="serif" style={{ fontSize:'32px', lineHeight:'1', letterSpacing:'-0.02em', color:c.text }}>
              {lang==='ru'?'Студия':'Studio'} <i style={{ color:'oklch(62% 0.2 275)' }}>{lang==='ru'?'настроек':'tools'}</i>
            </div>
          </div>
          <button onClick={onClose} className={ske('btn', isDark)} style={{
            width:'36px', height:'36px', borderRadius:'10px',
            display:'flex', alignItems:'center', justifyContent:'center', color: c.textMuted,
          }}>
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M18 6L6 18M6 6l12 12"/></svg>
          </button>
        </div>

        <div style={{ flex:1, overflowY:'auto', padding:'22px 28px 32px', display:'flex', flexDirection:'column', gap:'16px' }}>

          {/* Add collection */}
          {card(<>
            <div style={{ display:'flex', alignItems:'center', gap:'12px', marginBottom:'18px' }}>
              <div className="ske-accent" style={{
                width:'34px', height:'34px', borderRadius:'10px',
                display:'flex', alignItems:'center', justifyContent:'center',
              }}>
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="white" strokeWidth="2.5"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/><line x1="12" y1="11" x2="12" y2="17"/><line x1="9" y1="14" x2="15" y2="14"/></svg>
              </div>
              <div>
                <div className="serif" style={{ fontSize:'20px', color:c.text, letterSpacing:'-0.01em' }}>
                  {lang==='ru'?'Новая коллекция':'New collection'}
                </div>
                <div className="mono" style={{ fontSize:'14px', color:c.textSubtle, letterSpacing:'0.12em', marginTop:'2px' }}>
                  {lang==='ru'?'ИНДЕКСИРОВАТЬ ПАПКУ → QDRANT':'INDEX A FOLDER → QDRANT'}
                </div>
              </div>
            </div>

            {fieldLabel(lang==='ru'?'ИМЯ КОЛЛЕКЦИИ':'COLLECTION NAME')}
            <input value={collName} onChange={e=>setCollName(e.target.value)} disabled={indexing}
              placeholder={lang==='ru'?'например: my_music':'e.g. my_music'} className={inputClass} style={{ ...inputStyle, marginBottom:'12px' }} />

            {fieldLabel(lang==='ru'?'ПУТЬ К ПАПКЕ':'FOLDER PATH')}
            <div style={{ display:'flex', gap:'8px', marginBottom:'12px' }}>
              <button onClick={handlePick} disabled={picking||indexing} className={ske('btn', isDark)} style={{

                cursor: picking||indexing?'not-allowed':'pointer',

                {lang==='ru'?'Выбрать':'Pick'}

// ─── Onboarding (compact, themed) ─────────────────────────────────────────────
function OnboardingScreen({ isDark, lang, onDone, onLang, onTheme }) {
  const c = useColors(isDark);
  const [folderPath, setFolderPath] = useState('');
  const [collName, setCollName] = useState('my_collection');
  const [betterLyrics, setBetterLyrics] = useState(false);
  const [refineMetadata, setRefineMetadata] = useState(false);
  const [picking, setPicking] = useState(false);
  const [error, setError] = useState('');
  const [indexing, setIndexing] = useState(false);
  const [stepStatus, setStepStatus] = useState({});
  const [showModal, setShowModal] = useState(false);
  const [modalTrackCount, setModalTrackCount] = useState(null);
  const [modalError, setModalError] = useState(null);
  const [stageProgress, setStageProgress] = useState({});

  const handlePick = async () => {
    setPicking(true); setError('');
    try { const res = await apiFetch('/library/pick-folder'); if (res.path) setFolderPath(res.path); else setError(lang==='ru'?'Папка не выбрана':'No folder picked'); }
    catch (e) { setError(e.message); } finally { setPicking(false); }
  };

  const handleIndex = async () => {
    if (!folderPath || indexing) return;
    setIndexing(true); setShowModal(true); setModalError(null); setModalTrackCount(null); setStageProgress({});
    setStepStatus({ lyrics:'idle', facts:'idle', metadata:'idle', dense:'idle', audio:'idle', analysis:'idle' });
    const c = collName.trim() || 'my_collection';
    try {
      const res = await apiFetch('/library/index', { method:'POST',
        body: JSON.stringify({ folder_path:folderPath, collection_name:c, better_lyrics_quality:betterLyrics, enhance_by_musicbrainz:refineMetadata }) });
      if (res.status === 'failed') { setModalError(res.message); setIndexing(false); return; }
      if (!res.job_id) {
        setStepStatus({ metadata:'done', lyrics:'done', audio:'done', analysis:'done' });
        setModalTrackCount(res.count || 0);
        localStorage.setItem('active_collection', c);
        setTimeout(onDone, 800); return;
      }
      const evt = new EventSource(`${API}/index/progress/${res.job_id}`);
      evt.onmessage = (event) => {
        try {
          const data = JSON.parse(event.data);
          if (data.stages) {
            const statusMap = { completed: 'done', failed: 'failed', running: 'running', pending: 'pending' };
            setStepStatus(prev => {
              const newStatus = { ...prev };
              for (const [key, stage] of Object.entries(data.stages)) {
                newStatus[key] = (statusMap[stage.status] || stage.status) || 'pending';
              }
              return newStatus;
            });
            // Merge event-specific fields into the correct stage
            if (data.stage && data.stages[data.stage]) {
              const ev = data.stages[data.stage];
              if (data.current !== undefined) ev.current = data.current;
              if (data.total !== undefined) ev.total = data.total;
              if (data.eta_seconds !== undefined) ev.eta_seconds = data.eta_seconds;
              if (data.message !== undefined) ev.message = data.message;
            }
            setStageProgress(prev => {
              const newProg = { ...prev };
              for (const [key, stage] of Object.entries(data.stages)) {
                newProg[key] = {
                  current: stage.current ?? prev[key]?.current ?? 0,
                  total: stage.total ?? prev[key]?.total ?? 0,
                  eta: stage.eta_seconds ?? prev[key]?.eta ?? null,
                  message: stage.message ?? prev[key]?.message ?? null,
                  found: stage.found ?? prev[key]?.found ?? null,
                  not_found: stage.not_found ?? prev[key]?.not_found ?? null,
                };
              }
              return newProg;
            });
          }
          if (data.overall_status === 'completed') {
            evt.close();
            setStepStatus(prev => ({ ...prev, ...Object.fromEntries(
              Object.keys(prev).filter(k => prev[k] === 'pending').map(k => [k, 'done'])
            )}));
            setModalTrackCount(data.stages?.lyrics?.current || data.stages?.metadata?.current || 0);
            localStorage.setItem('active_collection', c);
            setTimeout(onDone, 800);
          } else if (data.overall_status === 'failed') {
            evt.close(); setModalError(data.error || data.message); setIndexing(false);
          }
        } catch {}
      };
      evt.onerror = () => { evt.close(); if (indexing) { setModalError(lang==='ru'?'Соединение потеряно':'Connection lost'); setIndexing(false); } };
    } catch (e) { setModalError(e.message); setIndexing(false); }
  };

  return (
    <div className="grain" style={{
      width:'100vw', height:'100vh', overflow:'auto', position:'relative',
      background: isDark
        ? 'radial-gradient(ellipse at top, #15151b 0%, #0a0a0e 60%, #07070a 100%)'
        : 'radial-gradient(ellipse at top, #fafaff 0%, #ececf3 60%, #e3e2e8 100%)',
      color: c.text,
    }}>
      <div style={{ display:'flex', justifyContent:'space-between', padding:'24px 32px' }}>
        <div style={{ display:'flex', alignItems:'center', gap:'12px' }}>
          <BrandMark size={36} isDark={isDark} />
          <span className="serif" style={{ fontSize:'28px', letterSpacing:'-0.02em' }}>Musi<i style={{ color:'oklch(62% 0.2 275)' }}>X</i></span>
        </div>
        <TopRightControls isDark={isDark} lang={lang} onLang={onLang} onTheme={onTheme} onSettings={() => {}} />
      </div>

      <div style={{ maxWidth:'620px', margin:'40px auto 0', padding:'0 32px' }}>
        <div className="mono" style={{ fontSize:'14px', color:c.textSubtle, letterSpacing:'0.32em', marginBottom:'14px' }}>
          — {lang==='ru'?'ПЕРВЫЙ ЗАПУСК':'FIRST RUN'}
        </div>
        <h1 className="serif" style={{ fontSize:'56px', lineHeight:'1.02', letterSpacing:'-0.025em', marginBottom:'18px' }}>
          {lang==='ru' ? <>Добро <i style={{ color:'oklch(62% 0.2 275)' }}>пожаловать</i>.</> : <>Welcome <i style={{ color:'oklch(62% 0.2 275)' }}>aboard</i>.</>}
        </h1>
        <p style={{ fontSize:'15px', color:c.textMuted, lineHeight:'1.6', marginBottom:'34px' }}>
          {lang==='ru'
            ? 'MusiX индексирует музыкальную папку локально и позволяет искать треки по смыслу — текстам и звуку. Ничего не уходит в облако.'
            : 'MusiX indexes a music folder locally so you can search tracks by meaning — lyrics and sound. Nothing leaves your machine.'}
        </p>

        <div className={ske('panel', isDark)} style={{ padding:'26px 28px', borderRadius:'18px' }}>
          <div className="mono" style={{ fontSize:'14px', color:c.textSubtle, letterSpacing:'0.22em', marginBottom:'8px' }}>
            {lang==='ru'?'ИМЯ КОЛЛЕКЦИИ':'COLLECTION NAME'}
          </div>
          <input value={collName} onChange={e=>setCollName(e.target.value)} disabled={indexing}
            className={ske('inset', isDark)} style={{ width:'100%', padding:'10px 13px', borderRadius:'10px', border:'none',
              color:c.text, fontSize:'15px', outline:'none', fontFamily:"'JetBrains Mono', monospace", marginBottom:'18px' }} />

          <div className="mono" style={{ fontSize:'14px', color:c.textSubtle, letterSpacing:'0.22em', marginBottom:'8px' }}>
            {lang==='ru'?'ПАПКА С МУЗЫКОЙ':'MUSIC FOLDER'}
          </div>
          <div style={{ display:'flex', gap:'8px', marginBottom:'14px' }}>
            <button onClick={handlePick} disabled={picking||indexing}
              className={ske('btn', isDark)} style={{ padding:'11px 16px', borderRadius:'10px', fontSize:'14px',
                color:c.textMuted, display:'flex', alignItems:'center', gap:'6px', flexShrink:0,
                cursor: picking||indexing?'not-allowed':'pointer' }}>
              {picking ? <Spinner size={12} /> : '📁'}
              {picking ? '…' : (lang==='ru'?'Выбрать':'Pick')}
            </button>
            <input value={folderPath} onChange={e=>setFolderPath(e.target.value)} disabled={indexing}
              placeholder="/path/to/music"
              className={ske('inset', isDark)} style={{ flex:1, padding:'11px 13px', borderRadius:'10px', border:'none',
                color:c.text, fontSize:'15px', outline:'none', fontFamily:"'JetBrains Mono', monospace" }} />
          </div>

          <label style={{ display:'flex', alignItems:'center', gap:'8px', fontSize:'14px', color:c.textMuted, marginBottom:'8px' }}>
            <ToggleSwitch checked={betterLyrics} onChange={v=>setBetterLyrics(v)} isDark={isDark} />
            {lang==='ru'?'Лучшее качество текстов (Musixmatch — медленнее)':'Better lyrics (Musixmatch — slower)'}
          </label>
          <label style={{ display:'flex', alignItems:'center', gap:'8px', fontSize:'14px', color:c.textMuted, marginBottom:'18px' }}>
            <ToggleSwitch checked={refineMetadata} onChange={v=>setRefineMetadata(v)} isDark={isDark} />
            {lang==='ru'?'Дополнить пропущенные метаданные из интернета':'Refine metadata with online lookup'}
          </label>

          <button onClick={handleIndex} disabled={indexing||!folderPath.trim()}
            className="ske-accent" style={{
              width:'100%', padding:'13px 20px', borderRadius:'12px',
              fontSize:'15px', fontWeight:'600', letterSpacing:'0.08em',
              opacity: indexing||!folderPath.trim() ? 0.5 : 1,
              cursor: indexing||!folderPath.trim() ? 'not-allowed' : 'pointer',
              display:'flex', alignItems:'center', justifyContent:'center', gap:'8px',
            }}>
            {indexing ? <><Spinner size={14} color="white" /> {lang==='ru'?'ИДЁТ ИНДЕКСАЦИЯ':'INDEXING'}</> : (lang==='ru'?'▶ НАЧАТЬ ИНДЕКСАЦИЮ':'▶ START INDEXING')}
          </button>

          {error && <div style={{ marginTop:'14px', padding:'10px 14px', borderRadius:'10px', background:c.redBg, color:c.red, fontSize:'14px' }}>{error}</div>}
        </div>
      </div>

      {showModal && (
        <IndexingModal isDark={isDark} lang={lang} collectionName={collName}
          stepStatus={stepStatus} trackCount={modalTrackCount} errorMessage={modalError}
          onClose={() => { setShowModal(false); setStepStatus({}); setModalError(null); }}
          stageProgress={stageProgress} />
      )}
    </div>
  );
}

// ─── App ──────────────────────────────────────────────────────────────────────
function App() {
  const [isDark, setDark] = useState(() => (localStorage.getItem('musix_theme') || 'dark') === 'dark');
  const [lang, setLang]   = useState(() => localStorage.getItem('musix_lang') || 'ru');
  const [section, setSection] = useState('home'); // home | search | recommend | library
  const [settingsOpen, setSettingsOpen] = useState(false);
  const [themeAnim, setThemeAnim] = useState(false);
  const [appState, setAppState] = useState('checking');

  const [collections, setCollections] = useState([]);
  const [activeCollection, setActiveCollection] = useState(() => localStorage.getItem('active_collection') || '');
  const [deleteConfirm, setDeleteConfirm] = useState(null);
  const [stats, setStats] = useState(null);

  const c = useColors(isDark);

  // Boot
  useEffect(() => {
    apiFetch('/library/collections')
      .then(res => {
        if (!res.qdrant_available) { setAppState('no-qdrant'); return; }
        const cols = res.collections || [];
        setCollections(cols);
        const stored = localStorage.getItem('active_collection');
        if (!stored && cols.length > 0) {
          const best = cols.reduce((a,b) => b.count > a.count ? b : a, cols[0]);
          setActiveCollection(best.name);
          localStorage.setItem('active_collection', best.name);
        }
        setAppState((res.total_points || 0) > 0 ? 'ready' : 'onboarding');
      })
      .catch(() => setAppState('no-qdrant'));
  }, []);

  const loadCollections = useCallback(() =>
    apiFetch('/library/collections').then(data => {
      setCollections(data.collections || []);
    }).catch(() => {}), []);

  // Stats for landing
  useEffect(() => {
    if (appState !== 'ready' || !activeCollection) return;
    const col = `?collection_name=${encodeURIComponent(activeCollection)}`;
    apiFetch(`/library/stats${col}`).then(setStats).catch(()=>{});
  }, [activeCollection, appState]);

  const switchCollection = (name) => {
    setActiveCollection(name);
    localStorage.setItem('active_collection', name);
  };

  const deleteCollection = async (name) => {
    try {
      await apiFetch(`/library/collection/${encodeURIComponent(name)}`, { method:'DELETE' });
      const res = await apiFetch('/library/collections');
      const cols = res.collections || [];
      setCollections(cols);
      if (name === activeCollection) {
        if (cols.length > 0) {
          const best = cols.reduce((a,b) => b.count > a.count ? b : a, cols[0]);
          setActiveCollection(best.name);
          localStorage.setItem('active_collection', best.name);
        } else {
          setActiveCollection('');
          localStorage.removeItem('active_collection');
        }
      }
      setDeleteConfirm(null);
    } catch (e) { alert((lang==='ru'?'Ошибка: ':'Error: ') + e.message); }
  };

  const handleTheme = () => {
    setThemeAnim(true);
    setTimeout(() => setThemeAnim(false), 380);
    setDark(d => { const next = !d; localStorage.setItem('musix_theme', next?'dark':'light'); return next; });
  };
  const handleLang = (l) => { setLang(l); localStorage.setItem('musix_lang', l); };

  // Boot state screens
  if (appState === 'checking') return (
    <div style={{ width:'100vw', height:'100vh', display:'flex', flexDirection:'column', alignItems:'center', justifyContent:'center',
      background: isDark ? '#0a0a0e' : '#f2f1f6', gap:'18px' }}>
      <BrandMark size={50} isDark={isDark} />
      <Spinner size={20} />
    </div>
  );
  if (appState === 'no-qdrant') return <NoQdrantScreen isDark={isDark} lang={lang} />;
  if (appState === 'onboarding') return (
    <OnboardingScreen isDark={isDark} lang={lang} onLang={handleLang} onTheme={handleTheme}
      onDone={() => { loadCollections(); setAppState('ready'); }} />
  );

  const sectionMap = {
    search:    SearchSection,
    recommend: RecommendSection,
    library:   LibrarySection,
  };
  const ActiveSection = sectionMap[section];

  return (
    <div className={themeAnim ? 'theme-transition theme-fade' : ''} style={{
      display:'flex', width:'100vw', height:'100vh', overflow:'hidden', background: c.bg,
    }}>
      {section === 'home' ? (
        <LandingScreen
          isDark={isDark} lang={lang}
          onLang={handleLang} onTheme={handleTheme} onSettings={() => setSettingsOpen(true)}
          onNav={(id) => setSection(id)}
          activeCollection={activeCollection}
          hasLibrary={collections.length > 0}
          stats={stats}
        />
      ) : (
        <Fragment>
          <Sidebar
            section={section} onNav={setSection} onHome={() => setSection('home')}
            isDark={isDark} lang={lang}
            collections={collections} activeCollection={activeCollection}
            onCollectionSwitch={switchCollection}
            onCollectionDelete={(name) => setDeleteConfirm(name)}
            onSettings={() => setSettingsOpen(true)}
          />
          <div key={section} style={{ flex:1, minWidth:0, display:'flex', flexDirection:'column', overflow:'hidden', animation:'fadeIn 0.3s ease' }}>
            <ActiveSection isDark={isDark} lang={lang} activeCollection={activeCollection} />
          </div>
        </Fragment>
      )}

      {settingsOpen && (
        <SettingsPanel isDark={isDark} lang={lang}
          onClose={() => setSettingsOpen(false)}
          onCollectionsUpdate={loadCollections}
          activeCollection={activeCollection} />
      )}

      {deleteConfirm && (
        <DeleteConfirm isDark={isDark} lang={lang} name={deleteConfirm}
          onCancel={() => setDeleteConfirm(null)}
          onConfirm={() => deleteCollection(deleteConfirm)} />
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
