          >{detail.name}</h1>
          <div className="mono" style={{ fontSize: 11, letterSpacing: '0.16em', color: 'rgba(238,238,243,.55)', marginBottom: 16, textTransform: 'uppercase' }}>
            {detail.tracks.length} {lang === 'ru' ? 'ТРЕКОВ' : 'TRACKS'} · {fmtTotal(totalDur)}
          </div>
          <p
            contentEditable suppressContentEditableWarning spellCheck={false}
            onBlur={onDescBlur}
            style={{
              fontFamily: "'Noto Serif Display', Georgia, serif", fontStyle: 'italic', fontWeight: 300,
              color: detail.description ? 'rgba(216,204,255,.85)' : 'rgba(238,238,243,.3)',
              fontSize: 17, lineHeight: 1.45, maxWidth: 540, margin: '0 0 22px',
              cursor: 'text', padding: '2px 0', border: '1px solid transparent', borderRadius: 8, outline: 'none',
            }}
          >{detail.description || (lang === 'ru' ? 'добавьте описание…' : 'add a description…')}</p>
          <div style={{ display: 'flex', gap: 10, marginTop: 'auto', alignItems: 'center' }}>
            <button
              className="cta-v3" style={{ padding: '11px 24px' }}
              onClick={() => {
                if (!detail.tracks[0]) return;
                const queue = detail.tracks.map(tr => ({ track: tr }));
                onPlayTrack(queue[0], queue);
              }}>
              ▶ {lang === 'ru' ? 'Слушать всё' : 'Play all'}
            </button>
            <div style={{ flex: 1 }} />
            <button
              onClick={onDelete}
              title={lang === 'ru' ? 'Удалить плейлист' : 'Delete playlist'}
              style={{
                width: 40, height: 40, borderRadius: '50%',
                background: 'rgba(255,255,255,.04)', border: '1px solid rgba(255,255,255,.06)',
                color: 'rgba(238,238,243,.7)', cursor: 'pointer', fontSize: 16,
              }}>🗑</button>
          </div>
        </div>
      </div>

      {detail.missing_track_ids.length > 0 && (
        <div className="mono" style={{
          padding: '10px 14px', borderRadius: 10, fontSize: 12, letterSpacing: '0.08em',
          background: 'rgba(255,180,80,.05)', border: '1px solid rgba(255,180,80,.18)',
          color: 'rgba(255,200,140,.7)', margin: '12px 0',
        }}>
          ⚠ {detail.missing_track_ids.length} {lang === 'ru' ? 'ТРЕК(А) НЕ НАЙДЕНЫ В ТЕКУЩЕЙ КОЛЛЕКЦИИ — СКРЫТЫ, НО НЕ УДАЛЕНЫ. РЕИНДЕКСАЦИЯ ВЕРНЁТ ИХ' : 'TRACK(S) NOT FOUND IN CURRENT COLLECTION — HIDDEN, NOT REMOVED. RE-INDEX TO RESTORE'}
        </div>
      )}

      <div style={{ display: 'flex', flexDirection: 'column', gap: 6 }}>
        {(() => {
          // Build the HIT-shaped queue once per render so every row's onPlay
          // sends the SAME array — App.handlePlayTrack uses it both as the
          // player's queue AND as the id-set for batch metadata enrichment.
          const queue = detail.tracks.map(tr => ({ track: tr }));
          return detail.tracks.map(t => (
            <PlaylistTrackRow
              key={t.track_id}
              track={t}
              isDragging={dragId === t.track_id}
              onDragStart={onDragStart(t.track_id)}
              onDragOver={onDragOver(t.track_id)}
              onDragLeave={onDragLeave}
              onDrop={onDrop(t.track_id)}
              onPlay={() => onPlayTrack({ track: t }, queue)}
              onArtist={() => navigateToArtist && navigateToArtist(t.artist)}
              onRemove={() => onRemoveTrack(t.track_id)}
              playlistId={playlistId}
              listing={listing}
              lang={lang}
              activeCollection={activeCollection}
            />
          ));
        })()}
      </div>
    </div>
  );
}

// ─── LIBRARY SECTION ──────────────────────────────────────────────────────────
function LibrarySection({ isDark, lang, activeCollection, onPlayTrack, navigateToArtist, playerTrack, onAddToPlaylist, playlistsListing, visible }) {
  const c = useColors(isDark);

  // ── Data fetching ─────────────────────────────────────────────────────
  const [stats, setStats] = useState(null);                  // /library/stats
  const [albumsData, setAlbumsData] = useState(null);        // /library/albums
  const [likedData, setLikedData] = useState(null);          // /library/liked-songs
  const [recentData, setRecentData] = useState(null);        // /playback/recent
  const [listenData, setListenData] = useState(null);        // /library/listening-stats
  const [albumSort, setAlbumSort] = useState('alphabetical');
  const [recentSort, setRecentSort] = useState('last_played');

  // ── UI state ──────────────────────────────────────────────────────────
  const [activeTab, setActiveTab] = useState(() => localStorage.getItem('library_active_tab') || 'albums');
  const [distOpen, setDistOpen] = useState(() => localStorage.getItem('library_distributions_open') === '1');
  const [albumModal, setAlbumModal] = useState(null);  // currently-open AlbumSummary
  const [likedMap, setLikedMap] = useState({});
  // playlistsListing is now provided by App-level usePlaylists (lifted in Plan 19 follow-up)
  const [activePlaylistId, setActivePlaylistId] = React.useState(null);
  const [showNewPlaylistModal, setShowNewPlaylistModal] = React.useState(false);

  const toggleLike = async (track_id) => {
    const next = !(likedMap[track_id] !== false);   // default-true for items already in liked list
    setLikedMap(p => ({ ...p, [track_id]: next }));
    try {
      await apiFetch(`/search/tracks/${track_id}/reaction`, {
        method: 'POST',
        headers: {'Content-Type':'application/json'},
        body: JSON.stringify({ collection_name: activeCollection, reaction: next ? 'like' : null }),
      });
      apiFetch(`/library/liked-songs?collection_name=${encodeURIComponent(activeCollection)}`).then(setLikedData).catch(() => {});
    } catch {
      setLikedMap(p => ({ ...p, [track_id]: !next }));   // rollback
    }
  };

  useEffect(() => { localStorage.setItem('library_active_tab', activeTab); }, [activeTab]);
  useEffect(() => { localStorage.setItem('library_distributions_open', distOpen ? '1' : '0'); }, [distOpen]);

  // ── Effect 1: 4 endpoints unrelated to albumSort ─────────────────────
  // Re-fires when the user navigates back to Library (visible→true) so that
  // liked-songs, recent plays, and listening-stats reflect activity from
  // the Player tab. LibrarySection stays mounted (visibility-toggled), so
  // without a `visible` dep this would only run once and the panel would
  // grow stale after each play / like.
  useEffect(() => {
    if (!activeCollection) return;
    if (visible === false) return;
    const col = encodeURIComponent(activeCollection);
    apiFetch(`/library/stats?collection_name=${col}`).then(setStats).catch(() => setStats(null));
    apiFetch(`/library/liked-songs?collection_name=${col}`).then(d => {
      setLikedData(d);
      setLikedMap(p => { const next = {...p}; (d?.tracks || []).forEach(t => { next[t.track_id] = true; }); return next; });
    }).catch(() => setLikedData({tracks:[]}));
    apiFetch(`/playback/recent?collection_name=${col}&limit=50`).then(setRecentData).catch(() => setRecentData({tracks:[]}));
    // getTimezoneOffset() returns minutes where local = UTC - offset; negate it
    // so the backend gets the additive UTC→local shift (UTC+3 → +180) for
    // bucketing the peak hour in the user's own timezone.
    const tzOffset = -new Date().getTimezoneOffset();
    apiFetch(`/library/listening-stats?collection_name=${col}&lang=${lang}&tz_offset_minutes=${tzOffset}`).then(setListenData).catch(() => setListenData(null));
  }, [activeCollection, lang, visible]);

  // ── Effect 2: only albums (refires on sort change) ───────────────────
  useEffect(() => {
    if (!activeCollection) return;
    const col = encodeURIComponent(activeCollection);
    apiFetch(`/library/albums?collection_name=${col}&sort=${albumSort}`)
      .then(setAlbumsData).catch(() => setAlbumsData({albums:[]}));
  }, [activeCollection, albumSort]);

  const albumsCount = albumsData?.albums?.length ?? 0;
  const likedCount  = likedData?.tracks?.length ?? 0;
  const recentCount = recentData?.tracks?.length ?? 0;

  return (
    <div style={{ flex:1, display:'flex', flexDirection:'column', overflow:'hidden', background:c.bg }}>
      <SectionHeader
        isDark={isDark} lang={lang}
        kicker={lang==='ru' ? 'РАЗДЕЛ 03 · БИБЛИОТЕКА' : 'SECTION 03 · LIBRARY'}
        title={lang==='ru' ? 'Твоя коллекция' : 'Your library'}
        accent={lang==='ru' ? 'в звуках' : 'in sounds'}
      />

      <div style={{ flex:1, overflowY:'auto', padding:'18px 24px 60px' }}>
        <div style={{ maxWidth:'1180px', margin:'0 auto', display:'flex', flexDirection:'column', gap:'10px' }}>

          <LibraryHeroLine stats={stats} albumCount={albumsCount} isDark={isDark} lang={lang} collection={activeCollection} />

          <DistributionsToggle open={distOpen} onToggle={() => setDistOpen(o => !o)} isDark={isDark} lang={lang} />
          {distOpen && <DistributionsPanel stats={stats} isDark={isDark} lang={lang} />}

          <ListeningWidgetsRow data={listenData} isDark={isDark} lang={lang} />

          <LibraryTabsStrip
            active={activeTab}
            onChange={setActiveTab}
            counts={{ albums: albumsCount, liked: likedCount, recent: recentCount, playlists: playlistsListing.playlists.length }}
            isDark={isDark}
            lang={lang}
          />

          {/* Tab content */}
          {activeTab === 'albums' && (
            <AlbumsGridTab
              albums={albumsData?.albums || []}
              sort={albumSort}
              onSortChange={setAlbumSort}
              onAlbumOpen={(a) => setAlbumModal(a)}
              isDark={isDark} lang={lang}
              navigateToArtist={navigateToArtist}
            />
          )}
          {activeTab === 'liked' && (
            <LikedSongsTab
              tracks={likedData?.tracks || []}
              isDark={isDark} lang={lang}
              onPlayTrack={onPlayTrack}
              navigateToArtist={navigateToArtist}
              onAlbumClick={(albumTitle) => {
                const found = (albumsData?.albums || []).find(a => a.album_title === albumTitle);
                if (found) setAlbumModal(found);
              }}
              onToggleLike={toggleLike}
              likedMap={likedMap}
              currentTrackId={playerTrack?.track_id || null}
              onAddToPlaylist={onAddToPlaylist}
            />
          )}
          {activeTab === 'recent' && (
            <RecentlyPlayedTab
              tracks={recentData?.tracks || []}
              sort={recentSort}
              onSortChange={setRecentSort}
              isDark={isDark} lang={lang}
              onPlayTrack={onPlayTrack}
              navigateToArtist={navigateToArtist}
              onAlbumClick={(albumTitle) => {
                const found = (albumsData?.albums || []).find(a => a.album_title === albumTitle);
                if (found) setAlbumModal(found);
              }}
              onToggleLike={toggleLike}
              likedMap={likedMap}
              currentTrackId={playerTrack?.track_id || null}
              onAddToPlaylist={onAddToPlaylist}
            />
          )}
          {activeTab === 'playlists' && (
            <PlaylistsTab
              listing={playlistsListing}
              activePlaylistId={activePlaylistId}
              onOpenPlaylist={setActivePlaylistId}
              onCloseDetail={() => setActivePlaylistId(null)}
              onRequestCreate={() => setShowNewPlaylistModal(true)}
              onPlayTrack={onPlayTrack}
              isDark={isDark}
              lang={lang}
              activeCollection={activeCollection}
              navigateToArtist={navigateToArtist}
            />
          )}

        </div>
      </div>

      {albumModal && (
        <AlbumModal
          album={albumModal}
          onClose={() => setAlbumModal(null)}
          onPlayTrack={onPlayTrack}
          navigateToArtist={navigateToArtist}
          isDark={isDark}
          lang={lang}
          activeCollection={activeCollection}
        />
      )}
      {showNewPlaylistModal && (
        <NewPlaylistModal
          lang={lang}
          onCancel={() => setShowNewPlaylistModal(false)}
          onSubmit={async (name, desc) => {
            const created = await playlistsListing.createPlaylist(name, desc);
            setShowNewPlaylistModal(false);
            setActivePlaylistId(created.id);
          }}
        />
      )}
      {/* AddToPlaylistPopover is now rendered at App level (Plan 19 follow-up) */}
    </div>
  );
}

      {lang==='ru' ? 'РАСПРЕДЕЛЕНИЯ' : 'DISTRIBUTIONS'} <span style={{ display:'inline-block', transform: open ? 'rotate(180deg)' : 'rotate(0)', transition:'transform 0.25s' }}>▾</span>
    </button>

}
function DistributionsPanel({ stats, isDark, lang }) {
  const c = useColors(isDark);
  const decades = stats?.decades || [];
  const maxDec = decades.reduce((m, d) => Math.max(m, d.count || 0), 0) || 1;
  const peakDec = decades.reduce((p, d) => (d.count > (p?.count || 0) ? d : p), null);
  const genres = (stats?.genres || []).slice(0, 5);
  const maxGenre = genres.reduce((m, g) => Math.max(m, g.count || 0), 0) || 1;
  const artists = (stats?.top_artists || []).slice(0, 5);
  const maxArtist = artists.reduce((m, a) => Math.max(m, a.count || 0), 0) || 1;
  const colLbl = { fontFamily:"'JetBrains Mono', monospace", fontSize:'9px', color:c.textSubtle, letterSpacing:'0.2em', textTransform:'uppercase', marginBottom:'10px' };

  return (
    <div style={{
      background: isDark ? 'rgba(15,12,25,.5)' : 'rgba(255,255,255,.5)',
      border: `1px solid ${c.border}`, borderRadius:'12px',
      backdropFilter:'blur(20px)', WebkitBackdropFilter:'blur(20px)',
      padding:'14px 18px',
      display:'grid', gridTemplateColumns:'1fr 1fr 1fr', gap:'22px',
      animation: 'fadeIn 0.28s cubic-bezier(.22,.9,.3,1)',
    }}>
      {/* Decades */}
      <div>
        <div style={colLbl}>{lang==='ru' ? 'ПО ЭПОХАМ' : 'BY DECADE'}</div>
        <div style={{ display:'flex', alignItems:'flex-end', gap:'5px', height:'90px' }}>
          {decades.map((d, i) => {
            const h = Math.round((d.count / maxDec) * 70);
            const isPeak = peakDec && d.decade === peakDec.decade;
            const hue = 40 + (i / Math.max(1, decades.length-1)) * 240;
            return (
              <div key={d.decade} style={{ flex:1, display:'flex', flexDirection:'column', alignItems:'center', gap:'3px' }}>
                <div style={{
                  width:'100%', height: `${h}px`, minHeight:'2px',
                  borderRadius:'3px 3px 0 0',
                  background: `linear-gradient(180deg, oklch(72% 0.16 ${hue}), oklch(56% 0.18 ${hue}))`,
                  boxShadow: isPeak ? '0 0 8px oklch(70% 0.18 60 / 0.5)' : 'none',
                }} />
                <div className="mono" style={{ fontSize:'9px', color: isPeak ? c.amber : c.textSubtle, letterSpacing:'0.06em' }}>{d.decade}</div>
                <div className="mono" style={{ fontSize:'9px', color: c.textSubtle }}>{d.count}</div>
              </div>
            );
          })}
          {decades.length === 0 && <div style={{ color:c.textSubtle, fontSize:11, fontStyle:'italic' }}>{lang==='ru'?'Нет данных':'No data'}</div>}
        </div>
      </div>

      {/* Top genres */}
      <div>
        <div style={colLbl}>{lang==='ru' ? 'ПО ЖАНРАМ · TOP 5' : 'BY GENRE · TOP 5'}</div>
        {genres.map((g, i) => {
          const hue = 270 + i * 12;
          return (
            <div key={g.genre} style={{ marginBottom:'8px' }}>
              <div style={{ display:'flex', justifyContent:'space-between', alignItems:'baseline', fontSize:'12px' }}>
                <span style={{ color:c.text, overflow:'hidden', textOverflow:'ellipsis', whiteSpace:'nowrap', maxWidth:'65%' }}>{g.genre}</span>
                <span className="mono" style={{ color:c.textMuted, fontSize:'11px' }}>{g.count} · {g.pct}%</span>
              </div>
              <div style={{ height:'5px', borderRadius:'3px', background:'rgba(255,255,255,.05)', overflow:'hidden', marginTop:'4px' }}>
                <div style={{ height:'100%', width:`${Math.round((g.count/maxGenre)*100)}%`, background:`linear-gradient(90deg, oklch(60% 0.18 ${hue}), oklch(70% 0.16 ${hue+25}))`, borderRadius:'3px' }} />
              </div>
            </div>
          );
        })}
        {genres.length === 0 && <div style={{ color:c.textSubtle, fontSize:11, fontStyle:'italic' }}>{lang==='ru'?'Нет данных':'No data'}</div>}
      </div>

      {/* Top artists */}
      <div>
        <div style={colLbl}>{lang==='ru' ? 'ПО АРТИСТАМ · TOP 5' : 'BY ARTIST · TOP 5'}</div>
        {artists.map((a, i) => {
          const hue = 200 + i * 25;
          return (
            <div key={a.artist} style={{ marginBottom:'8px' }}>
              <div style={{ display:'flex', justifyContent:'space-between', alignItems:'baseline', fontSize:'12px' }}>
                <span style={{ color:c.text, overflow:'hidden', textOverflow:'ellipsis', whiteSpace:'nowrap', maxWidth:'65%' }}>{a.artist}</span>
                <span className="mono" style={{ color:c.textMuted, fontSize:'11px' }}>{a.count} tracks</span>
              </div>
              <div style={{ height:'5px', borderRadius:'3px', background:'rgba(255,255,255,.05)', overflow:'hidden', marginTop:'4px' }}>
                <div style={{ height:'100%', width:`${Math.round((a.count/maxArtist)*100)}%`, background:`linear-gradient(90deg, oklch(60% 0.18 ${hue}), oklch(70% 0.16 ${hue+25}))`, borderRadius:'3px' }} />
              </div>
            </div>
          );
        })}
        {artists.length === 0 && <div style={{ color:c.textSubtle, fontSize:11, fontStyle:'italic' }}>{lang==='ru'?'Нет данных':'No data'}</div>}
      </div>
    </div>
  );
}
function ListeningWidgetsRow({ data, isDark, lang }) {
  const c = useColors(isDark);
  const fmtDur = (sec) => {
    if (!sec) return '—';
    const h = Math.floor(sec / 3600);
    const m = Math.floor((sec % 3600) / 60);
    return h > 0 ? `${h}h ${m}m` : `${m}m`;
  };
  const since = data?.since ? new Date(data.since).toLocaleDateString(lang==='ru'?'ru-RU':'en-US', {month:'short', day:'numeric'}) : null;
  const top_track = data?.top_track;
  const top_artist = data?.top_artist;
  const peak = data?.peak_hour;
  const widget = (lbl, val, sub, tint) => (
    <div style={{
      background: 'rgba(255,255,255,.04)',
      border: `1px solid ${c.border}`,
      borderRadius: '10px',
      padding: '10px 12px',
      backdropFilter:'blur(20px)',
      display:'flex', flexDirection:'column', gap:'2px',
    }}>
      <div className="mono" style={{ fontSize:'9px', color:c.textSubtle, letterSpacing:'0.2em', textTransform:'uppercase' }}>{lbl}</div>
      <div style={{ fontSize: typeof val === 'string' && val.length > 12 ? '13px' : '18px', color: tint || c.text, fontWeight: 500, lineHeight: 1.2 }}>{val}</div>
      <div style={{ fontSize:'11px', color:c.textMuted }}>{sub || ' '}</div>
    </div>
  );
  return (
    <div style={{ display:'grid', gridTemplateColumns:'repeat(4, 1fr)', gap:'8px' }}>
      {widget(
        lang==='ru' ? '∑ ПРОСЛУШАНО' : '∑ LISTENED',
        fmtDur(data?.total_seconds_listened),
        since ? (lang==='ru' ? `с ${since}` : `since ${since}`) : null,
        'oklch(72% 0.18 145)'

// ─── NEW PLAYLIST MODAL ───────────────────────────────────────────────────────
function NewPlaylistModal({ onCancel, onSubmit, lang }) {
  const [name, setName] = React.useState('');
  const [description, setDescription] = React.useState('');
  const [busy, setBusy] = React.useState(false);
  const [error, setError] = React.useState(null);

  React.useEffect(() => {
    const onEsc = (e) => { if (e.key === 'Escape') onCancel(); };
    document.addEventListener('keydown', onEsc);
    document.body.style.overflow = 'hidden';
    return () => {
      document.removeEventListener('keydown', onEsc);
      document.body.style.overflow = '';
    };
  }, [onCancel]);

  const handleSubmit = async () => {
    const n = name.trim();
    if (!n) return;
    setBusy(true); setError(null);
    try {
      await onSubmit(n, description.trim() || null);
    } catch (e) {
      const msg = e?.detail || e?.message || String(e);
      if (/already exists|name already|409/.test(msg)) {
        setError(lang === 'ru' ? 'Плейлист с таким именем уже существует' : 'Playlist with this name already exists');
      } else {
        setError(msg);
      }
    } finally {
      setBusy(false);
    }
  };

  return (
    <div
      onClick={(e) => { if (e.target === e.currentTarget) onCancel(); }}
      style={{
        position: 'fixed', inset: 0, zIndex: 2000,
        background: 'rgba(8,6,16,.62)', backdropFilter: 'blur(8px)', WebkitBackdropFilter: 'blur(8px)',
        display: 'grid', placeItems: 'center',
      }}
    >
      <div style={{
        width: 440, padding: 28,
        background: 'linear-gradient(180deg, rgba(32,28,48,0.97) 0%, rgba(20,16,32,0.97) 60%)',
        border: '1px solid rgba(255,255,255,.08)',
        borderRadius: 18,
        boxShadow: 'inset 0 1px 0 rgba(255,255,255,.14), 0 28px 70px rgba(0,0,0,.6), 0 0 0 1px rgba(124,91,255,.18)',
      }}>
        <div className="mono" style={{ fontSize: 10, letterSpacing: '0.24em', color: 'rgba(238,238,243,.5)', marginBottom: 18, textTransform: 'uppercase' }}>
          {lang === 'ru' ? 'Новый плейлист' : 'New playlist'}
        </div>
        <div style={{ fontSize: 12, color: 'rgba(238,238,243,.6)', margin: '14px 0 6px', letterSpacing: '0.02em' }}>
          {lang === 'ru' ? 'Название' : 'Name'}
        </div>
        <input
          autoFocus
          value={name} onChange={(e) => setName(e.target.value)}
          onKeyDown={(e) => { if (e.key === 'Enter') handleSubmit(); }}
          placeholder={lang === 'ru' ? 'Например: Late night ride' : 'e.g.: Late night ride'}
          style={{
            width: '100%', padding: '10px 12px',
            background: 'rgba(0,0,0,.32)', border: '1px solid rgba(255,255,255,.07)',
            borderRadius: 10, color: '#fff', fontSize: 14, outline: 'none',
            boxShadow: 'inset 0 1px 2px rgba(0,0,0,.3)',
          }}
        />
        <div style={{ fontSize: 12, color: 'rgba(238,238,243,.6)', margin: '14px 0 6px', letterSpacing: '0.02em' }}>
          {lang === 'ru' ? 'Описание (опционально)' : 'Description (optional)'}
        </div>
        <textarea
          value={description} onChange={(e) => setDescription(e.target.value)}
          rows={3}
          style={{
            width: '100%', padding: '10px 12px',
            background: 'rgba(0,0,0,.32)', border: '1px solid rgba(255,255,255,.07)',
            borderRadius: 10, color: '#fff',
            fontFamily: "'Noto Serif Display', Georgia, serif", fontStyle: 'italic', fontSize: 15,
            outline: 'none', boxShadow: 'inset 0 1px 2px rgba(0,0,0,.3)', resize: 'vertical', minHeight: 76,
          }}
        />
        {error && (
          <div style={{ marginTop: 12, padding: '8px 12px', borderRadius: 8, fontSize: 12, color: '#ffc99a', background: 'rgba(255,180,80,.08)', border: '1px solid rgba(255,180,80,.25)' }}>
            {error}
          </div>
        )}
        <div style={{ display: 'flex', justifyContent: 'flex-end', gap: 10, marginTop: 22 }}>
          <button
            onClick={onCancel}
            style={{
              background: 'rgba(255,255,255,.04)', border: '1px solid rgba(255,255,255,.07)',
              color: 'rgba(238,238,243,.7)', padding: '10px 18px', borderRadius: 10, fontSize: 13, cursor: 'pointer',
            }}>{lang === 'ru' ? 'Отмена' : 'Cancel'}</button>
          <button
            className="cta-v3"
            disabled={busy || !name.trim()}
            onClick={handleSubmit}
            style={{ opacity: busy || !name.trim() ? 0.5 : 1 }}>
            {busy ? '…' : (lang === 'ru' ? 'Создать ▶' : 'Create ▶')}
          </button>
        </div>
      </div>
    </div>
  );
}

function AlbumModal({ album, onClose, onPlayTrack, navigateToArtist, isDark, lang, activeCollection }) {
  const c = useColors(isDark);
  const [hoverRow, setHoverRow] = useState(-1);
  const [likedMap, setLikedMap] = useState({});
  const [likeLoading, setLikeLoading] = useState({});

  // Lock body scroll while open
  useEffect(() => {
    const prev = document.body.style.overflow;
    document.body.style.overflow = 'hidden';
    return () => { document.body.style.overflow = prev; };
  }, []);

  // Esc to close
  useEffect(() => {
    const h = (e) => { if (e.key === 'Escape') onClose(); };
    document.addEventListener('keydown', h);
    return () => document.removeEventListener('keydown', h);
  }, [onClose]);

  // Lazy-load per-track reactions on mount
  useEffect(() => {
    if (!album?.tracks?.length || !activeCollection) return;
    const col = encodeURIComponent(activeCollection);
    Promise.all(album.tracks.map(t =>
      apiFetch(`/search/tracks/${t.track_id}/reaction?collection_name=${col}`).then(r => [t.track_id, r?.reaction === 'like']).catch(() => [t.track_id, false])
    )).then(pairs => setLikedMap(Object.fromEntries(pairs)));
  }, [album?.album_title, activeCollection]);

  const toggleLike = async (track_id) => {
    if (likeLoading[track_id]) return;
    const next = !likedMap[track_id];
    setLikeLoading(p => ({ ...p, [track_id]: true }));
    setLikedMap(p => ({ ...p, [track_id]: next }));   // optimistic
    try {
      await apiFetch(`/search/tracks/${track_id}/reaction`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ collection_name: activeCollection, reaction: next ? 'like' : null }),
      });
    } catch {
      setLikedMap(p => ({ ...p, [track_id]: !next })); // rollback
    } finally {
      setLikeLoading(p => ({ ...p, [track_id]: false }));
    }
  };

  const playFromIdx = (idx) => {
    const t = album.tracks[idx];
    if (!t || !onPlayTrack) return;
    onPlayTrack({ track: t }, album.tracks.map(tt => ({ track: tt })));
    onClose();
  };

  const fmtDur = (s) => {
    if (!s) return '—';
    const m = Math.floor(s / 60), r = Math.floor(s % 60);
    return `${m}:${String(r).padStart(2, '0')}`;
  };
  const totalDur = album.duration_seconds || 0;
  const totalDurFmt = `${Math.floor(totalDur/60)}:${String(Math.floor(totalDur%60)).padStart(2,'0')}`;

  return (
    <div
      onClick={onClose}
      style={{
        position:'fixed', inset:0, zIndex:100,
        background:'rgba(0,0,0,.6)', backdropFilter:'blur(6px)', WebkitBackdropFilter:'blur(6px)',
        display:'grid', placeItems:'center', padding:'20px',
        animation:'fadeIn 0.18s ease',
      }}
    >
      <div
        onClick={e => e.stopPropagation()}
        style={{
          background: isDark ? 'rgba(15,12,25,.96)' : 'rgba(255,255,255,.96)',
          border: `1px solid ${c.border}`,
          borderRadius:'14px',
          backdropFilter:'blur(20px)', WebkitBackdropFilter:'blur(20px)',
          padding:'18px',
          maxWidth:'720px', width:'100%', maxHeight:'80vh',
          display:'flex', flexDirection:'column', gap:'12px',
          boxShadow:'0 20px 60px rgba(0,0,0,.5)',
        }}
      >
        {/* Hero */}
        <div style={{ display:'flex', gap:'14px' }}>
          <div style={{ width:'140px', flexShrink:0 }}>
            <AlbumCover title={album.album_title} artist={album.primary_artist} size={140} isDark={isDark} coverPath={album.cover_art_path} radius={10} fluid />
          </div>
          <div style={{ flex:1, minWidth:0 }}>
            <div className="mono" style={{ fontSize:'10px', color:c.textSubtle, letterSpacing:'0.2em', textTransform:'uppercase' }}>{lang==='ru'?'АЛЬБОМ':'ALBUM'}</div>
            <div style={{ fontSize:'24px', lineHeight:1.1, color:c.text, margin:'4px 0', letterSpacing:'-0.01em' }}>{album.album_title}</div>
            <div
              onClick={() => { if (album.primary_artist_slug && navigateToArtist) { navigateToArtist(album.primary_artist_slug); onClose(); } }}
              style={{ fontSize:'13px', color:'#bba8ff', cursor:'pointer', display:'inline-block' }}
            >{album.primary_artist} →</div>
            {album.feat_artists?.length > 0 && (
              <div style={{ marginTop:'4px', display:'flex', gap:'5px', flexWrap:'wrap' }}>
                {album.feat_artists.map(f => (
                  <span key={f.slug}
                    onClick={() => { if (navigateToArtist) { navigateToArtist(f.slug); onClose(); } }}
                    style={{ padding:'2px 8px', borderRadius:'10px', background:'rgba(120,80,200,.18)', border:'1px solid rgba(120,80,200,.3)', color:'#bba8ff', fontSize:'10px', cursor:'pointer' }}>
                    {f.name}
                  </span>
                ))}
              </div>
            )}
            <div className="mono" style={{ display:'flex', gap:'14px', fontSize:'11px', color:c.textMuted, marginTop:'8px', letterSpacing:'0.06em' }}>
              <span>{album.year_range || album.year || '—'}</span>
              <span>·</span>
              <span>{album.track_count} {lang==='ru'?'треков':'tracks'}</span>
              <span>·</span>
              <span>{totalDurFmt}</span>
            </div>
          </div>
          <button onClick={onClose} style={{ alignSelf:'flex-start', background:'transparent', color:c.textMuted, fontSize:'18px', cursor:'pointer', padding:'4px 8px', border:'none' }}>✕</button>
        </div>

        {/* Actions */}
        <div style={{ display:'flex', gap:'8px' }}>
          <button onClick={() => playFromIdx(0)} style={{ padding:'7px 14px', borderRadius:'8px', fontSize:'12px', fontFamily:"'JetBrains Mono', monospace", background:'linear-gradient(180deg, oklch(60% 0.21 270), oklch(48% 0.22 285))', color:'#fff', border:'none', cursor:'pointer' }}>▶ {lang==='ru'?'Играть всё':'Play All'}</button>
        </div>

        {/* Tracklist */}
        <div style={{ background:'rgba(0,0,0,.25)', borderRadius:'8px', overflow:'auto', flex:1 }}>
          {album.tracks.map((t, i) => {
            const liked = !!likedMap[t.track_id];
            return (
              <div
                key={t.track_id}
                onClick={() => playFromIdx(i)}
                onMouseEnter={() => setHoverRow(i)}
                onMouseLeave={() => setHoverRow(-1)}
                style={{
                  display:'grid', gridTemplateColumns:'24px 1fr 60px 30px',
                  gap:'10px', padding:'8px 12px', alignItems:'center',
                  borderBottom:`1px solid ${c.border}`,
                  fontSize:'12px', cursor:'pointer',
                  background: hoverRow === i ? 'rgba(255,255,255,.04)' : 'transparent',
                }}
              >
                <span className="mono" style={{ color: hoverRow === i ? '#bba8ff' : c.textSubtle, fontSize:'11px', textAlign:'center' }}>{hoverRow === i ? '▶' : i+1}</span>
                <span style={{ color:c.text, whiteSpace:'nowrap', overflow:'hidden', textOverflow:'ellipsis' }}>{t.title}</span>
                <span className="mono" style={{ color:c.textSubtle, fontSize:'11px', textAlign:'right' }}>{fmtDur(t.duration)}</span>
                <button
                  onClick={(e) => { e.stopPropagation(); toggleLike(t.track_id); }}
                  style={{ background:'transparent', border:'none', cursor:'pointer', fontSize:'13px', color: liked ? '#ff7aa8' : c.textSubtle, padding:0 }}
                  title={liked ? (lang==='ru'?'Убрать лайк':'Unlike') : (lang==='ru'?'Лайкнуть':'Like')}
                >{liked ? '♥' : '♡'}</button>
              </div>
            );
          })}
        </div>
      </div>
    </div>
  );
}


// ─── Indexing progress (compact, 2 sections) ─────────────────────────────────
function IndexingProgress({ stepStatus, stageProgress, lang, c, isDark }) {
  const internetStages = [
    { key:'lyrics',   icon:'♪', labelRu:'Тексты',         labelEn:'Lyrics' },
    { key:'facts',    icon:'★', labelRu:'Факты',         labelEn:'Facts' },
    { key:'metadata', icon:'⌕', labelRu:'Метаданные',    labelEn:'Metadata' },
  ];
  const localStages = [
    { key:'dense',    icon:'◆', labelRu:'Dense эмбеддинги', labelEn:'Dense embeddings' },
    { key:'audio',    icon:'♫', labelRu:'CLAP аудио',     labelEn:'CLAP audio' },
  ];
  const finalStages = [
    { key:'analysis', icon:'∿', labelRu:'Анализ схожести', labelEn:'Similarity analysis' },
  ];

  const CheckIcon = ({ size=16, color }) => (
    <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke={color} strokeWidth="3" strokeLinecap="round" strokeLinejoin="round">
      <path d="M4 12l6 6L20 6"/>
    </svg>
  );

  useEffect(() => {
    let styleEl = document.getElementById('indexing-pulse-style');
    if (!styleEl) {
      styleEl = document.createElement('style');
      styleEl.id = 'indexing-pulse-style';
      document.head.appendChild(styleEl);
    }
    styleEl.textContent = '@keyframes indexing-pulse { 0%,100%{opacity:0.4;transform:scale(0.8)} 50%{opacity:1;transform:scale(1)} }';
  }, [isDark]);

  const renderSection = (header, stages) => (
    <div style={{ display:'flex', flexDirection:'column', gap:'14px' }}>
      {header && (
        <div className="mono" style={{
          fontSize:'12px', color: c.textSubtle, letterSpacing:'0.22em',
          paddingBottom:'6px', marginBottom:'2px',
          borderBottom: `1px solid ${isDark ? 'rgba(255,255,255,0.06)' : 'rgba(0,0,0,0.08)'}`,
        }}>
          {header}
        </div>
      )}
      {stages.map(s => {
        const status = stepStatus[s.key] || 'pending';
        const active = status === 'running';
        const done = status === 'done' || status === 'completed';
        const fail = status === 'failed';
        const partial = status === 'partial';
        const accent = done ? c.green : fail ? c.red : partial ? c.amber : active ? c.amber : c.textSubtle;
        const prog = stageProgress && stageProgress[s.key];
        const pct = prog && prog.total && prog.total > 0 ? Math.max(0, Math.min(100, ((prog.current || 0) / prog.total) * 100)) : 0;
        const etaText = prog && prog.eta != null && prog.eta > 0 ? ` · ETA ${Math.round(prog.eta)}s` : '';
        const labelText = prog && prog.total != null
          ? `${prog.current || 0}/${prog.total}`
          : null;

        // Icon background
        let iconBg;
        if (done) iconBg = c.greenBg;
        else if (fail) iconBg = c.redBg;
        else if (active) iconBg = `oklch(72% 0.13 75 / 0.12)`;
        else iconBg = isDark ? 'rgba(255,255,255,0.04)' : 'rgba(0,0,0,0.04)';

        return (
          <div key={s.key} style={{ display:'flex', alignItems:'flex-start', gap:'12px' }}>
            <div style={{
              width:'35px', height:'35px', borderRadius:'10px', flexShrink:0, marginTop:'2px',
              display:'flex', alignItems:'center', justifyContent:'center',
              fontSize:'17px', color: accent, fontFamily:"'JetBrains Mono', monospace",
              background: iconBg,
              boxShadow: isDark ? 'inset 0 1px 0 rgba(255,255,255,0.05)' : 'inset 0 1px 0 rgba(255,255,255,0.85)',
            }}>
              {done ? <CheckIcon size={18} color={accent} />
                : fail ? '×'
                : active ? (
                    <span style={{
                      width:'10px', height:'10px', borderRadius:'50%',
                      background: accent,
                      animation: 'indexing-pulse 1.2s ease-in-out infinite',
                    }} />
                  )
                : s.icon}
            </div>
            <div style={{ flex:1, minWidth:0 }}>
              <div style={{ fontSize:'17px', color: c.text, fontWeight: active?'600':'500' }}>
                {lang==='ru' ? s.labelRu : s.labelEn}
              </div>
              {(active || done || partial || fail) && (
                <div style={{ display:'flex', flexDirection:'column', gap:'5px', marginTop:'6px' }}>
                  {active && (
                    <div>
                      <div style={{
                        height:'5px', borderRadius:'3px', overflow:'hidden', marginBottom:'4px',
                        background: isDark ? 'rgba(255,255,255,0.06)' : 'rgba(0,0,0,0.06)',
                      }}>
                        <div style={{
                          height:'100%', width:`${pct}%`, borderRadius:'3px',
                          background: `linear-gradient(90deg, oklch(60% 0.18 270), oklch(68% 0.2 290))`,
                          transition: 'width 0.5s ease-out',
                          boxShadow: `0 0 6px oklch(60% 0.18 270 / 0.4)`,
                        }} />
                      </div>
                      {labelText && (
                        <div className="mono" style={{ fontSize:'12px', color:c.textMuted, letterSpacing:'0.06em' }}>
                          {labelText}{etaText}
                          {prog && prog.found != null && prog.not_found != null && (
                            <span>
                              {' '}· <span style={{ color: c.green }}>{prog.found} {lang==='ru'?'найдено':'found'}</span>
                              {prog.not_found > 0 && <span>, {prog.not_found} <span style={{ color: c.amber }}>{lang==='ru'?'не найдено':'not found'}</span></span>}
                            </span>
                          )}
                        </div>
                      )}
                    </div>
                  )}
                  {done && (
                    <div>
                      <div className="mono" style={{ fontSize:'12px', color:c.green, letterSpacing:'0.06em' }}>
                        {prog && prog.message ? prog.message : (lang==='ru'?'Готово':'Done')}
                      </div>
                      {prog && prog.found != null && prog.not_found != null && (
                        <div className="mono" style={{ fontSize:'12px', color:c.textMuted, letterSpacing:'0.06em', marginTop:'2px' }}>
                          <span style={{ color: c.green }}>{prog.found} {lang==='ru'?'найдено':'found'}</span>
                          {prog.not_found > 0 && <span>, {prog.not_found} <span style={{ color: c.amber }}>{lang==='ru'?'не найдено':'not found'}</span></span>}
                        </div>
                      )}
                    </div>
                  )}
                  {partial && (
                    <div>
                      <div className="mono" style={{ fontSize:'12px', color:c.amber, letterSpacing:'0.06em' }}>
                        {prog && prog.message ? prog.message : ''}
                      </div>
                      {prog && prog.found != null && prog.not_found != null && (
                        <div className="mono" style={{ fontSize:'12px', color:c.textMuted, letterSpacing:'0.06em', marginTop:'2px' }}>
                          <span style={{ color: c.green }}>{prog.found} {lang==='ru'?'найдено':'found'}</span>
                          {prog.not_found > 0 && <span>, {prog.not_found} <span style={{ color: c.amber }}>{lang==='ru'?'не найдено':'not found'}</span></span>}
                        </div>
                      )}
                    </div>
                  )}
                  {fail && (
                    <div className="mono" style={{ fontSize:'12px', color:c.red, letterSpacing:'0.06em' }}>
                      {prog && prog.message ? prog.message : (lang==='ru'?'Ошибка':'Error')}
                    </div>
                  )}
                </div>
              )}
            </div>
          </div>
        );
      })}
    </div>
  );

  const grooveStyle = {
    padding: '6px 0',
    borderTop: `1px solid ${isDark ? 'rgba(255,255,255,0.07)' : 'rgba(0,0,0,0.09)'}`,
    borderBottom: `1px solid ${isDark ? 'rgba(255,255,255,0.025)' : 'rgba(0,0,0,0.04)'}`,
  };

  return (
    <div style={{ display:'flex', flexDirection:'column', gap:'14px' }}>
      {renderSection(
        lang==='ru' ? 'ПОИСК ДАННЫХ В ИНТЕРНЕТЕ' : 'FETCHING DATA',
        internetStages
      )}
      <div style={grooveStyle} />
      {renderSection(
        lang==='ru' ? 'ЛОКАЛЬНАЯ ИНДЕКСАЦИЯ' : 'LOCAL INDEXING',
        localStages
      )}
      {renderSection(null, finalStages)}
    </div>
  );
}

            </div>

                background: 'transparent', color: isDark?'#aaa':'#555',
                border: `1px solid ${isDark?'rgba(255,255,255,0.18)':'rgba(0,0,0,0.18)'}`,
                cursor: 'pointer',
              }}
            >{lang==='ru'?'Без AI':'No AI'}</button>
          </div>
        </div>
      </div>
    );
  }

  if (phase === 'ai-bootstrap') {
    return (
      <div className="modal-overlay" onClick={(e) => { if (e.target === e.currentTarget) onAiBootstrapLater?.(); }}>
        <div className={ske('panel', isDark)} style={{ maxWidth: 540, padding: 28, borderRadius: 20, animation: 'scaleIn 0.3s cubic-bezier(.22,.9,.3,1)' }}>
          <h2 className="serif" style={{ fontSize: 24, marginTop: 0, marginBottom: 8 }}>

          </p>
          <p style={{ fontSize: 14, color: isDark?'#ddd':'#222', marginTop: 16 }}>
            {lang==='ru'?'Запустить AI-индексацию артефактов?':'Run AI artifact indexing?'}
          </p>
          <ul style={{ paddingLeft: 18, fontSize: 12, color: isDark?'#aaa':'#555', lineHeight: 1.6 }}>

            <li>{lang==='ru'?'Refined Facts — отфильтрованные/сжатые факты':'Refined Facts — filtered/shortened facts'}</li>

// ─── AI Indexing card (inside SettingsPanel) ──────────────────────────────────
function AIIndexingCard({ isDark, lang, activeCollection, aiStatus }) {
  const c = useColors(isDark);
  const [status, setStatus] = useState({ sonic_vibe: null, refined_facts: null, artist_bio: null });
  const [busy, setBusy] = useState({ sonic_vibe: false, refined_facts: false, artist_bio: false });
  const [error, setError] = useState(null);
  const pollRef = useRef(null);

  const refresh = useCallback(async () => {
    if (!activeCollection) return;
    try {
      const data = await apiFetch(`/library/ai-index/status?collection=${encodeURIComponent(activeCollection)}`);
      setStatus(data);
    } catch { /* swallow — surface via error state only if Run/Reset fails */ }
  }, [activeCollection]);

  useEffect(() => {
    refresh();
    return () => { if (pollRef.current) { clearInterval(pollRef.current); pollRef.current = null; } };
  }, [refresh]);

  const isRunning = (s) => s && s.status === 'running';
  const someRunning = isRunning(status.sonic_vibe) || isRunning(status.refined_facts) || isRunning(status.artist_bio);

  useEffect(() => {
    if (someRunning && !pollRef.current) {
      pollRef.current = setInterval(refresh, 3000);
    } else if (!someRunning && pollRef.current) {
      clearInterval(pollRef.current);
      pollRef.current = null;
      // One last refresh to capture the final state.
      refresh();
    }
  }, [someRunning, refresh]);

  const runJob = async (taskType) => {
    if (!activeCollection) { setError(lang === 'ru' ? 'Выбери коллекцию' : 'Pick a collection first'); return; }
    setError(null);
    setBusy(b => ({ ...b, [taskType]: true }));
    try {
      await apiFetch(`/library/ai-index/${taskType}`, {
        method: 'POST',
        body: JSON.stringify({
          collection_name: activeCollection,
          lang,
          llm_base_url: localStorage.getItem('llm_base_url') || undefined,
          llm_model:    localStorage.getItem('llm_model')    || undefined,
          ...(taskType === 'artist_bio' && { bio_source: 'web' }),
        }),
      });
      refresh();
    } catch (e) {
      setError(e?.message || String(e));
    } finally {
      setBusy(b => ({ ...b, [taskType]: false }));
    }
  };

  const resetCache = async (taskType) => {
    if (!activeCollection) return;
    const confirmMsg = lang === 'ru'
      ? 'Сбросить кэш для этой задачи?'
      : 'Reset cache for this task?';
    if (!window.confirm(confirmMsg)) return;
    setError(null);
    try {
      await apiFetch(
        `/library/ai-index/${taskType}/cache?collection=${encodeURIComponent(activeCollection)}`,
        { method: 'DELETE' },
      );
      refresh();
    } catch (e) {
      setError(e?.message || String(e));
    }
  };

  const fmtStatus = (s) => {
    if (!s) return lang === 'ru' ? 'Никогда не запускалась' : 'Never run';
    const skipped = s.n_skipped || 0;
    const parts = [
      `${lang === 'ru' ? 'Статус' : 'Status'}: ${s.status}`,
      `${s.n_done}/${s.n_total} ${lang === 'ru' ? 'обработано' : 'processed'}`,
    ];
    if (skipped) {
      parts.push(`${skipped} ${lang === 'ru' ? 'пропущено' : 'skipped'}`);
    }
    if (s.n_failed) {
      parts.push(`${s.n_failed} ${lang === 'ru' ? 'ошибок' : 'failed'}`);
    }
    if (s.lang) parts.push(s.lang.toUpperCase());
    return parts.join(' · ');
  };

  // Detect the "completed with zero real work" case so we can surface a
  // distinct note instead of letting "done · 0/N processed · N skipped"
  // get lost in the muted-mono line.
  const isEmptyDone = (s) =>
    s && s.status === 'done' && (s.n_done || 0) === 0 && (s.n_skipped || 0) > 0;

  const skipReasonHint = (taskType) => {
    if (taskType === 'sonic_vibe') {
      return lang === 'ru'
        ? 'Нет входных данных: ни sonic_tags, ни фактов. Сначала запусти SONIC PROMPT-PROBING и/или обогащение фактами в библиотеке.'
        : 'No inputs available: neither sonic_tags nor song facts. Run sonic prompt-probing and/or facts enrichment in the library first.';
    }
    if (taskType === 'artist_bio') {
      return lang === 'ru'
        ? 'Веб-поиск не вернул результатов. Проверь подключение к интернету и настройки LLM.'
        : 'Web search returned no results. Check your internet connection and LLM settings.';
    }
    return lang === 'ru'
      ? 'Нет фактов о треках/артистах для уточнения. Сначала обогати библиотеку фактами.'
      : 'No song or artist facts to refine. Enrich your library with facts first.';
  };

  const Row = ({ title, taskType }) => {
    const s = status[taskType];
    const running = isRunning(s);
    return (
      <div style={{ padding: '12px 0', borderBottom: `1px solid ${c.border}` }}>
        <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', gap: 10 }}>
          <div style={{ fontWeight: 600, color: c.text, fontSize: 14 }}>{title}</div>
          <div style={{ display: 'flex', gap: 8 }}>
            <button
              disabled={busy[taskType] || running || !activeCollection || !aiStatus?.aiAvailable}
              onClick={() => runJob(taskType)}
              title={!aiStatus?.aiAvailable
                ? (lang==='ru'?'LLM не подключён':'Connect LLM to enable')
                : undefined}
              style={{
                padding: '6px 12px', borderRadius: 8, cursor: (busy[taskType] || running || !activeCollection) ? 'not-allowed' : 'pointer',
                fontSize: 12, fontWeight: 500,
                background: isDark ? 'rgba(124,91,255,0.18)' : 'rgba(124,91,255,0.10)',
                color: isDark ? '#cdb8ff' : '#5b3fd6',
                border: `1px solid ${isDark ? 'rgba(124,91,255,0.35)' : 'rgba(124,91,255,0.30)'}`,
                opacity: (busy[taskType] || running || !activeCollection) ? 0.5 : 1,
              }}>
              {running
                ? (lang === 'ru' ? 'Идёт…' : 'Running…')
                : (lang === 'ru' ? '▶ Запустить' : '▶ Run')}
            </button>
            <button
              onClick={() => resetCache(taskType)}
              disabled={!activeCollection}
              style={{
                padding: '6px 12px', borderRadius: 8, cursor: activeCollection ? 'pointer' : 'not-allowed',
                fontSize: 12, fontWeight: 500,
                background: 'transparent', color: c.textMuted,
                border: `1px solid ${c.border}`,
                opacity: activeCollection ? 1 : 0.5,
              }}>
              ↻ {lang === 'ru' ? 'Сброс' : 'Reset'}
            </button>
          </div>
        </div>
        <div style={{ marginTop: 6, fontSize: 11, color: c.textMuted, fontFamily: "'JetBrains Mono', monospace" }}>
          {fmtStatus(s)}
        </div>
        {isEmptyDone(s) && (
          <div style={{
            marginTop: 6, fontSize: 11, lineHeight: 1.5,
            color: 'oklch(70% 0.13 75)',
          }}>
            ⚠ {lang === 'ru'
              ? 'Завершено без реальной работы — все треки пропущены.'
              : 'Completed with no real work — every track was skipped.'}
            <br />{skipReasonHint(taskType)}
          </div>
        )}
        {s && s.error && (
          <div style={{ marginTop: 6, fontSize: 11, lineHeight: 1.5, color: 'oklch(62% 0.18 25)' }}>
            ✗ {s.error}
          </div>
        )}
      </div>
    );
  };

  return (
    <div style={{
      padding: '16px 18px', borderRadius: 12,
      border: `1px solid ${c.border}`, marginTop: 18,
      background: isDark ? 'rgba(255,255,255,0.02)' : 'rgba(0,0,0,0.02)',
    }}>
      <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'baseline', marginBottom: 6 }}>
        <div className="mono-label" style={{ color: c.textMuted, fontSize: 11, letterSpacing: '0.15em' }}>
          AI INDEXING
        </div>
        <div style={{ fontSize: 11, color: c.textSubtle }}>
          {lang === 'ru' ? 'Текущий язык' : 'Current language'}: {lang.toUpperCase()}
        </div>
      </div>
      {aiStatus?.aiEnabledForCollection === false && (
        <div style={{
          margin: '8px 0 14px', padding: '10px 14px', borderRadius: 8,
          fontSize: 12, lineHeight: 1.5,
          background: isDark ? 'rgba(255,160,40,0.10)' : 'rgba(255,160,40,0.08)',
          border: '1px solid rgba(255,160,40,0.35)',
          color: isDark ? '#f4c08a' : '#a06010',
          display: 'flex', alignItems: 'center', gap: 10,
        }}>
          <span style={{ flex: 1 }}>
            ⚠ {lang==='ru'
              ? 'AI отключён для этой коллекции. Индексация недоступна.'
              : 'AI is disabled for this collection. Indexing is unavailable.'}
          </span>
          <button
            onClick={async () => {
              if (!activeCollection) return;
              try {
                await apiFetch(`/library/collections/${encodeURIComponent(activeCollection)}/ai-enabled`, {
                  method: 'PATCH', body: JSON.stringify({ enabled: true }),
                });
                aiStatus?.setAiEnabledForCollection?.(true);
              } catch (e) { console.error(e); }
            }}
            style={{
              padding: '5px 12px', borderRadius: 6, fontSize: 12, fontWeight: 600,
              background: 'rgba(255,160,40,0.20)', color: 'inherit',
              border: '1px solid rgba(255,160,40,0.50)', cursor: 'pointer',
            }}
          >{lang==='ru'?'Включить':'Enable'}</button>
        </div>
      )}
      <Row title="Sonic Vibe" taskType="sonic_vibe" />
      <Row title={lang === 'ru' ? 'Уточнённые факты' : 'Refined Facts'} taskType="refined_facts" />
      <Row title={lang === 'ru' ? 'Биография артистов' : 'Artist Bio'} taskType="artist_bio" />
      <div style={{ fontSize: 11, color: c.textMuted, marginTop: 12, lineHeight: 1.5 }}>
        ⚠ {lang === 'ru'
          ? 'AI-индексация использует текущий язык фронта. Чтобы получить результат на другом языке, смени язык и запусти повторно.'
          : 'AI indexing uses your current frontend language. To get results in another language, switch language and re-run.'}
      </div>
      {error && (
        <div style={{ marginTop: 10, fontSize: 12, color: 'oklch(62% 0.18 25)' }}>
          {error}
        </div>
      )}
    </div>
  );
}

// ─── Per-collection AI toggle (Plan 6) ───────────────────────────────────────
function CollectionAIToggle({ collectionName, isActive, aiStatus, lang, isDark }) {
  const [enabled, setEnabled] = useState(true);
  const [loading, setLoading] = useState(true);
  const [saving, setSaving] = useState(false);

  useEffect(() => {
    let cancelled = false;
    setLoading(true);
    apiFetch(`/library/collections/${encodeURIComponent(collectionName)}/settings`)
      .then(r => { if (!cancelled) setEnabled(!!r.ai_enabled); })
      .catch(() => { if (!cancelled) setEnabled(true); })
      .finally(() => { if (!cancelled) setLoading(false); });
    return () => { cancelled = true; };
  }, [collectionName]);

  const onToggle = async () => {
    // Guard against double-clicks while a PATCH is in flight — without
    // this, two concurrent toggles capture stale `enabled` and the second
    // request can land with the pre-rollback value if the first errors.
    if (saving) return;
    const next = !enabled;
    setEnabled(next);
    setSaving(true);
    try {
      await apiFetch(`/library/collections/${encodeURIComponent(collectionName)}/ai-enabled`, {
        method: 'PATCH', body: JSON.stringify({ enabled: next }),
      });
      if (isActive && aiStatus?.setAiEnabledForCollection) {
        aiStatus.setAiEnabledForCollection(next);
      }
    } catch (e) {
      setEnabled(!next);
      console.error('failed to toggle ai_enabled', e);
    } finally {
      setSaving(false);
    }
  };

  const busy = loading || saving;
  return (
    <button
      type="button"
      onClick={onToggle}
      disabled={busy}
      style={{
        padding: '3px 12px', borderRadius: 99, fontSize: 11, fontWeight: 600,
        cursor: busy ? 'wait' : 'pointer',
        background: enabled
          ? (isDark ? 'rgba(40,160,80,0.18)' : 'rgba(40,160,80,0.12)')
          : (isDark ? 'rgba(160,160,160,0.10)' : 'rgba(160,160,160,0.10)'),
        color: enabled ? (isDark ? '#86dba0' : '#0a7e3a') : (isDark ? '#888' : '#888'),
        border: `1px solid ${enabled ? 'rgba(40,160,80,0.40)' : 'rgba(160,160,160,0.30)'}`,
      }}
    >
      {enabled ? (lang==='ru'?'ВКЛ':'ON') : (lang==='ru'?'ВЫКЛ':'OFF')}
    </button>
  );
}

// ─── Settings overlay (slides in from right) ─────────────────────────────────
function SettingsPanel({ isDark, lang, onClose, onCollectionsUpdate, activeCollection, aiStatus, onTheme, onLang, collections, onCollectionSwitch, onCollectionDelete }) {
  const c = useColors(isDark);
  const [models, setModels] = useState({});
  // Guard against legacy localStorage values: Web Storage stringifies `null` to the
  // literal string "null", which would then be sent to backend and tried as a HF
  // repo_id. Coerce any falsy/"null"/"undefined" to actual null so backend uses
  // its default model (jinaai/jina-embeddings-v2-small-en).
  const [textModel, setTextModel] = useState(() => {
    const v = localStorage.getItem('text_model');
    return (v && v !== 'null' && v !== 'undefined') ? v : null;
  });
  const [collName, setCollName] = useState('');
  const [folderPath, setFolderPath] = useState('');
  const [picking, setPicking] = useState(false);
  const [betterLyrics, setBetterLyrics] = useState(false);
  const [refineMetadata, setRefineMetadata] = useState(false);
  const [indexing, setIndexing] = useState(false);
  const [stepStatus, setStepStatus] = useState({});
  const [showModal, setShowModal] = useState(false);
  const [modalTrackCount, setModalTrackCount] = useState(null);
  const [modalError, setModalError] = useState(null);
  const [stageProgress, setStageProgress] = useState({});
  const [indexPhase, setIndexPhase] = useState('ai-setup');  // 'ai-setup' | 'indexing' | 'ai-bootstrap'
  const [enabledForNewCollection, setEnabledForNewCollection] = useState(true);

  const [llmBaseUrl, setLlmBaseUrl] = useState(() => localStorage.getItem('llm_base_url') || '');
  const [llmModel, setLlmModel] = useState(() => localStorage.getItem('llm_model') || '');
  const [llmSaved, setLlmSaved] = useState(false);

  useEffect(() => {
    apiFetch('/search/models/text').then(setModels).catch(() => {});
  }, []);

  // Persist only valid model names; otherwise REMOVE the key so getItem returns
  // null next time (instead of the string "null").
  useEffect(() => {
    if (textModel && typeof textModel === 'string') {
      localStorage.setItem('text_model', textModel);
    } else {
      localStorage.removeItem('text_model');
    }
  }, [textModel]);

  const handlePick = async () => {
    setPicking(true);
    try { const res = await apiFetch('/library/pick-folder'); if (res.path) setFolderPath(res.path); }
    catch {} finally { setPicking(false); }
  };

  const handleIndex = () => {
    if (!folderPath.trim() || indexing) return;
    setIndexPhase('ai-setup');
    setShowModal(true);
  };

  // `aiEnabledArg` is passed explicitly by the caller because React state
  // updates batched in the same tick won't have flushed yet — reading
  // `enabledForNewCollection` from the closure here would see the *previous*
  // render's value (stale), causing the post-indexing phase transition to
  // misroute (e.g. "Skip AI" would still land on ai-bootstrap).
  const startIndexing = async (aiEnabledArg = enabledForNewCollection) => {
    const colName = collName.trim() || 'my_collection';
    setIndexing(true); setModalError(null); setModalTrackCount(null); setStageProgress({});
    setStepStatus({ lyrics:'idle', facts:'idle', metadata:'idle', dense:'idle', audio:'idle', analysis:'idle' });
    try {
      // Only send text_model if user picked one — omit otherwise so backend
      // falls back to its default. Avoid sending the literal string "null".
      const validModel = (textModel && typeof textModel === 'string' && textModel !== 'null') ? textModel : undefined;
      const res = await apiFetch('/library/index', { method:'POST',
        body: JSON.stringify({ folder_path:folderPath, collection_name:colName, better_lyrics_quality:betterLyrics, text_model:validModel, enhance_by_musicbrainz:refineMetadata }) });
      if (res.status === 'failed') { setModalError(res.message); setIndexing(false); return; }
      if (!res.job_id) {
        setStepStatus({ metadata:'done', lyrics:'done', audio:'done', analysis:'done' });
        setModalTrackCount(res.count || 0);
        localStorage.setItem('active_collection', colName);
        onCollectionsUpdate && onCollectionsUpdate();
        // Phase transition (Plan 6): if AI is on for this collection and LLM probes ok, advance to ai-bootstrap
        if (aiStatus?.aiAvailable && aiEnabledArg) {
          setIndexPhase('ai-bootstrap');
        } else {
          setIndexPhase('indexing');  // stay in 'indexing' phase showing Done UI
        }
        return;
      }
      const evt = new EventSource(`${API}/index/progress/${res.job_id}`);
      evt.onmessage = (event) => {
        try {
          const data = JSON.parse(event.data);
          if (data.stages) {
            const statusMap = { completed: 'done', failed: 'failed', running: 'running', pending: 'pending' };
            setStepStatus(prev => {
              const newStatus = { ...prev };
              for (const [key, stage] of Object.entries(data.stages)) {
                newStatus[key] = (statusMap[stage.status] || stage.status) || 'pending';
              }
              return newStatus;
            });
            // Merge event-specific fields into the correct stage
            if (data.stage && data.stages[data.stage]) {
              const ev = data.stages[data.stage];
              if (data.current !== undefined) ev.current = data.current;
              if (data.total !== undefined) ev.total = data.total;
              if (data.eta_seconds !== undefined) ev.eta_seconds = data.eta_seconds;
              if (data.message !== undefined) ev.message = data.message;
            }
            setStageProgress(prev => {
              const newProg = { ...prev };
              for (const [key, stage] of Object.entries(data.stages)) {
                newProg[key] = {
                  current: stage.current ?? prev[key]?.current ?? 0,
                  total: stage.total ?? prev[key]?.total ?? 0,
                  eta: stage.eta_seconds ?? prev[key]?.eta ?? null,
                  message: stage.message ?? prev[key]?.message ?? null,
                  found: stage.found ?? prev[key]?.found ?? null,
                  not_found: stage.not_found ?? prev[key]?.not_found ?? null,
                };
              }
              return newProg;
            });
          }
          if (data.overall_status === 'completed') {
            evt.close();
            setStepStatus(prev => ({ ...prev, ...Object.fromEntries(
              Object.keys(prev).filter(k => prev[k] === 'pending').map(k => [k, 'done'])
            )}));
            setModalTrackCount(data.stages?.lyrics?.current || data.stages?.metadata?.current || 0);
            setIndexing(false);
            localStorage.setItem('active_collection', colName);
            onCollectionsUpdate && onCollectionsUpdate();
            // Phase transition (Plan 6): if AI is on for this collection and LLM probes ok, advance to ai-bootstrap
            if (aiStatus?.aiAvailable && aiEnabledArg) {
              setIndexPhase('ai-bootstrap');
            } else {
              setIndexPhase('indexing');  // stay in 'indexing' phase showing Done UI
            }
          } else if (data.overall_status === 'failed') {
            evt.close();
            setModalError(data.error || data.message);
            setIndexing(false);
          }
        } catch {}
      };
      evt.onerror = () => { evt.close(); if (indexing) { setModalError(lang==='ru'?'Соединение потеряно':'Connection lost'); setIndexing(false); } };
    } catch (e) { setModalError(e.message); setIndexing(false); }

                  method: 'PATCH', body: JSON.stringify({ enabled }),
                });
              } catch (e) { console.error('failed to persist ai_enabled', e); }
              if (enabled) {
                localStorage.setItem('llm_base_url', llmBaseUrl.trim());
                localStorage.setItem('llm_model', llmModel.trim());
                await aiStatus?.refresh?.();
              }
              setIndexPhase('indexing');
              await startIndexing(enabled);  // pass explicitly — state hasn't flushed
            }}
            onAiSkip={() => { setEnabledForNewCollection(false); setIndexPhase('indexing'); startIndexing(false); }}
            onAiBootstrapRun={async () => {
              const colName = collName.trim() || 'my_collection';
              const lang2 = lang || 'en';
              // allSettled, not all — partial failure shouldn't silently abort the
              // other tasks. We still close the modal but log each failure so it
              // appears in DevTools.
              const tasks = ['sonic_vibe', 'refined_facts', 'artist_bio'];
              const llmBaseUrl = localStorage.getItem('llm_base_url') || undefined;
              const llmModel   = localStorage.getItem('llm_model')    || undefined;
              const results = await Promise.allSettled(tasks.map(t =>
                apiFetch(`/library/ai-index/${t}`, { method:'POST', body: JSON.stringify({
                  collection_name: colName, lang: lang2, llm_base_url: llmBaseUrl, llm_model: llmModel,
                  ...(t === 'artist_bio' && { bio_source: 'web' }),
                }) })
              ));
              results.forEach((r, i) => {
                if (r.status === 'rejected') console.error(`AI indexing task '${tasks[i]}' failed:`, r.reason);
              });
              setShowModal(false);
            }}
            onAiBootstrapLater={() => setShowModal(false)}
          />
        )}
      </div>
    </>
  );
}

// ─── Onboarding (compact, themed) ─────────────────────────────────────────────
function OnboardingScreen({ isDark, lang, onDone, onLang, onTheme }) {
  const c = useColors(isDark);
  const [folderPath, setFolderPath] = useState('');
  const [collName, setCollName] = useState('my_collection');
  const [betterLyrics, setBetterLyrics] = useState(false);
  const [refineMetadata, setRefineMetadata] = useState(false);
  const [picking, setPicking] = useState(false);
  const [error, setError] = useState('');
  const [indexing, setIndexing] = useState(false);
  const [stepStatus, setStepStatus] = useState({});
  const [showModal, setShowModal] = useState(false);
  const [modalTrackCount, setModalTrackCount] = useState(null);
  const [modalError, setModalError] = useState(null);
  const [stageProgress, setStageProgress] = useState({});

  const handlePick = async () => {
    setPicking(true); setError('');
    try { const res = await apiFetch('/library/pick-folder'); if (res.path) setFolderPath(res.path); else setError(lang==='ru'?'Папка не выбрана':'No folder picked'); }
    catch (e) { setError(e.message); } finally { setPicking(false); }
  };

  const handleIndex = async () => {
    if (!folderPath || indexing) return;
    setIndexing(true); setShowModal(true); setModalError(null); setModalTrackCount(null); setStageProgress({});
    setStepStatus({ lyrics:'idle', facts:'idle', metadata:'idle', dense:'idle', audio:'idle', analysis:'idle' });
    const c = collName.trim() || 'my_collection';
    try {
      const res = await apiFetch('/library/index', { method:'POST',
        body: JSON.stringify({ folder_path:folderPath, collection_name:c, better_lyrics_quality:betterLyrics, enhance_by_musicbrainz:refineMetadata }) });
      if (res.status === 'failed') { setModalError(res.message); setIndexing(false); return; }
      if (!res.job_id) {
        setStepStatus({ metadata:'done', lyrics:'done', audio:'done', analysis:'done' });
        setModalTrackCount(res.count || 0);
        localStorage.setItem('active_collection', c);
        setTimeout(onDone, 800); return;
      }
      const evt = new EventSource(`${API}/index/progress/${res.job_id}`);
      evt.onmessage = (event) => {
        try {
          const data = JSON.parse(event.data);
          if (data.stages) {
            const statusMap = { completed: 'done', failed: 'failed', running: 'running', pending: 'pending' };
            setStepStatus(prev => {
              const newStatus = { ...prev };
              for (const [key, stage] of Object.entries(data.stages)) {
                newStatus[key] = (statusMap[stage.status] || stage.status) || 'pending';
              }
              return newStatus;
            });
            // Merge event-specific fields into the correct stage
            if (data.stage && data.stages[data.stage]) {
              const ev = data.stages[data.stage];
              if (data.current !== undefined) ev.current = data.current;
              if (data.total !== undefined) ev.total = data.total;
              if (data.eta_seconds !== undefined) ev.eta_seconds = data.eta_seconds;
              if (data.message !== undefined) ev.message = data.message;
            }
            setStageProgress(prev => {
              const newProg = { ...prev };
              for (const [key, stage] of Object.entries(data.stages)) {
                newProg[key] = {
                  current: stage.current ?? prev[key]?.current ?? 0,
                  total: stage.total ?? prev[key]?.total ?? 0,
                  eta: stage.eta_seconds ?? prev[key]?.eta ?? null,
                  message: stage.message ?? prev[key]?.message ?? null,
                  found: stage.found ?? prev[key]?.found ?? null,
                  not_found: stage.not_found ?? prev[key]?.not_found ?? null,
                };
              }
              return newProg;
            });
          }
          if (data.overall_status === 'completed') {
            evt.close();
            setStepStatus(prev => ({ ...prev, ...Object.fromEntries(
              Object.keys(prev).filter(k => prev[k] === 'pending').map(k => [k, 'done'])
            )}));
            setModalTrackCount(data.stages?.lyrics?.current || data.stages?.metadata?.current || 0);
            localStorage.setItem('active_collection', c);
            setTimeout(onDone, 800);
          } else if (data.overall_status === 'failed') {
            evt.close(); setModalError(data.error || data.message); setIndexing(false);
          }
        } catch {}
      };
      evt.onerror = () => { evt.close(); if (indexing) { setModalError(lang==='ru'?'Соединение потеряно':'Connection lost'); setIndexing(false); } };
    } catch (e) { setModalError(e.message); setIndexing(false); }
  };

  return (
    <div className="grain" style={{
      width:'100vw', height:'100vh', overflow:'auto', position:'relative',
      background: isDark
        ? 'radial-gradient(ellipse at top, #15151b 0%, #0a0a0e 60%, #07070a 100%)'
        : 'radial-gradient(ellipse at top, #fafaff 0%, #ececf3 60%, #e3e2e8 100%)',
      color: c.text,
    }}>
      <div style={{ display:'flex', justifyContent:'space-between', padding:'24px 32px' }}>
        <div style={{ display:'flex', alignItems:'center', gap:'12px' }}>
          <BrandMark size={36} isDark={isDark} />
          <span className="serif" style={{ fontSize:'28px', letterSpacing:'-0.02em' }}>Musi<i style={{ color:'oklch(62% 0.2 275)' }}>X</i></span>
        </div>
        <TopRightControls isDark={isDark} lang={lang} onLang={onLang} onTheme={onTheme} onSettings={() => {}} />
      </div>

      <div style={{ maxWidth:'620px', margin:'40px auto 0', padding:'0 32px' }}>
        <div className="mono" style={{ fontSize:'14px', color:c.textSubtle, letterSpacing:'0.32em', marginBottom:'14px' }}>
          — {lang==='ru'?'ПЕРВЫЙ ЗАПУСК':'FIRST RUN'}
        </div>
        <h1 className="serif" style={{ fontSize:'56px', lineHeight:'1.02', letterSpacing:'-0.025em', marginBottom:'18px' }}>
          {lang==='ru' ? <>Добро <i style={{ color:'oklch(62% 0.2 275)' }}>пожаловать</i>.</> : <>Welcome <i style={{ color:'oklch(62% 0.2 275)' }}>aboard</i>.</>}
        </h1>
        <p style={{ fontSize:'15px', color:c.textMuted, lineHeight:'1.6', marginBottom:'34px' }}>
          {lang==='ru'
            ? 'MusiX индексирует музыкальную папку локально и позволяет искать треки по смыслу — текстам и звуку. Ничего не уходит в облако.'
            : 'MusiX indexes a music folder locally so you can search tracks by meaning — lyrics and audio. Nothing leaves your machine.'}
        </p>

        <div className={ske('panel', isDark)} style={{ padding:'26px 28px', borderRadius:'18px' }}>
          <div className="mono" style={{ fontSize:'14px', color:c.textSubtle, letterSpacing:'0.22em', marginBottom:'8px' }}>
            {lang==='ru'?'ИМЯ КОЛЛЕКЦИИ':'COLLECTION NAME'}
          </div>
          <input value={collName} onChange={e=>setCollName(e.target.value)} disabled={indexing}
            className={ske('inset', isDark)} style={{ width:'100%', padding:'10px 13px', borderRadius:'10px', border:'none',
              color:c.text, fontSize:'15px', outline:'none', fontFamily:"'JetBrains Mono', monospace", marginBottom:'18px' }} />

          <div className="mono" style={{ fontSize:'14px', color:c.textSubtle, letterSpacing:'0.22em', marginBottom:'8px' }}>
            {lang==='ru'?'ПАПКА С МУЗЫКОЙ':'MUSIC FOLDER'}
          </div>
          <div style={{ display:'flex', gap:'8px', marginBottom:'14px' }}>
            <button onClick={handlePick} disabled={picking||indexing}
              className={ske('btn', isDark)} style={{ padding:'11px 16px', borderRadius:'10px', fontSize:'14px',
                color:c.textMuted, display:'flex', alignItems:'center', gap:'6px', flexShrink:0,
                cursor: picking||indexing?'not-allowed':'pointer' }}>
              {picking ? <Spinner size={12} /> : '📁'}
              {picking ? '…' : (lang==='ru'?'Выбрать':'Pick')}
            </button>
            <input value={folderPath} onChange={e=>setFolderPath(e.target.value)} disabled={indexing}
              placeholder="/path/to/music"
              className={ske('inset', isDark)} style={{ flex:1, padding:'11px 13px', borderRadius:'10px', border:'none',
                color:c.text, fontSize:'15px', outline:'none', fontFamily:"'JetBrains Mono', monospace" }} />
          </div>

          <label style={{ display:'flex', alignItems:'center', gap:'8px', fontSize:'14px', color:c.textMuted, marginBottom:'8px' }}>
            <ToggleSwitch checked={betterLyrics} onChange={v=>setBetterLyrics(v)} isDark={isDark} />
            {lang==='ru'?'Лучшее качество текстов (Musixmatch — медленнее)':'Better lyrics (Musixmatch — slower)'}
          </label>
          <label style={{ display:'flex', alignItems:'center', gap:'8px', fontSize:'14px', color:c.textMuted, marginBottom:'18px' }}>
            <ToggleSwitch checked={refineMetadata} onChange={v=>setRefineMetadata(v)} isDark={isDark} />
            {lang==='ru'?'Дополнить пропущенные метаданные из интернета':'Refine metadata with online lookup'}
          </label>

          <button onClick={handleIndex} disabled={indexing||!folderPath.trim()}
            className="ske-accent" style={{
              width:'100%', padding:'13px 20px', borderRadius:'12px',
              fontSize:'15px', fontWeight:'600', letterSpacing:'0.08em',
              opacity: indexing||!folderPath.trim() ? 0.5 : 1,
              cursor: indexing||!folderPath.trim() ? 'not-allowed' : 'pointer',
              display:'flex', alignItems:'center', justifyContent:'center', gap:'8px',
            }}>
            {indexing ? <><Spinner size={14} color="white" /> {lang==='ru'?'ИДЁТ ИНДЕКСАЦИЯ':'INDEXING'}</> : (lang==='ru'?'▶ НАЧАТЬ ИНДЕКСАЦИЮ':'▶ START INDEXING')}
          </button>

          {error && <div style={{ marginTop:'14px', padding:'10px 14px', borderRadius:'10px', background:c.redBg, color:c.red, fontSize:'14px' }}>{error}</div>}
        </div>
      </div>

      {showModal && (
        <IndexingModal isDark={isDark} lang={lang} collectionName={collName}
          stepStatus={stepStatus} trackCount={modalTrackCount} errorMessage={modalError}
          onClose={() => { setShowModal(false); setStepStatus({}); setModalError(null); }}

      )}
    </div>
  );
}

// ─── Song facts helper (hardcoded, track-aware) ─────────────────────────────
function getSongFacts(track, lang) {
  if (!track) return [];
  const t = lang === 'ru';
  const hue = ((track.title?.charCodeAt(0)||65)*37 + (track.artist?.charCodeAt(0)||65)*17) % 360;
  const keys = ['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
  const modes = ['Major','Minor'];
  const key = keys[Math.abs(track.title?.charCodeAt(0)||0) % keys.length];
  const mode = modes[Math.abs(track.artist?.charCodeAt(0)||0) % 2];
  const bpm = 80 + Math.abs(track.title?.charCodeAt(1)||0) % 60;
  const moods = ['Melancholic','Energetic','Dreamy','Dark','Euphoric','Nostalgic','Intimate','Cinematic'];
  const mood = moods[Math.abs(track.title?.charCodeAt(2)||0) % moods.length];
  const lang2 = ['English','Russian','Japanese','Korean','French'];
  const langVal = lang2[Math.abs(track.artist?.charCodeAt(1)||0) % lang2.length];

  return [
    { icon: '♪', label: t?'Тональность':'Key', value: `${key} ${mode}` },
    { icon: '⏱', label: t?'Темп':'BPM', value: `${bpm} BPM` },
    { icon: '◐', label: t?'Настроение':'Mood', value: mood },
    { icon: 'μ', label: t?'Жанр':'Genre', value: track.genre || 'Indie' },
    { icon: '📅', label: t?'Год':'Year', value: track.year || '—' },
    { icon: '🌐', label: t?'Язык':'Lang', value: langVal },
    { icon: '⏱', label: t?'Длительность':'Length', value: track.duration ? secsToMMSS(track.duration) : '—' },
    { icon: '♫', label: t?'Альбом':'Album', value: track.album || '—' },
  ];
}

// ─── VIBE LINE ───────────────────────────────────────────────────────────────
function VibeLine({ trackId, collection, lang, isDark }) {
  const [phrase, setPhrase] = useState(null);

  useEffect(() => {
    if (!trackId || !collection) { setPhrase(null); return; }
    let cancelled = false;
    apiFetch(
      `/metadata/tracks/${encodeURIComponent(trackId)}/sonic-vibe` +
      `?collection=${encodeURIComponent(collection)}` +
      `&lang=${encodeURIComponent(lang || 'en')}`
    )
      .then(res => { if (!cancelled) setPhrase(res?.phrase || null); })
      .catch(() => { if (!cancelled) setPhrase(null); });
    return () => { cancelled = true; };
  }, [trackId, collection, lang]);

  if (!phrase) return null;

  return (
    <div
      key={phrase}
      style={{
