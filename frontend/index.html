                      }}>{f}</div>
                    ))}
                  </div>
                </div>
              )}
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

// ─── RECOMMEND SECTION ────────────────────────────────────────────────────────
function RecommendSection({ isDark, lang, activeCollection, onPlayTrack }) {
  const c = useColors(isDark);

  // Preset results
  const [presetLoading, setPresetLoading] = useState(false);
  const [presetResults, setPresetResults] = useState([]);
  const [activePreset, setActivePreset] = useState(null);
  const [presetLimit, setPresetLimit] = useState(10);

  // Track-similarity — picks a track from search results, then queries similar
  const [trackQuery, setTrackQuery] = useState('');
  const [trackOptions, setTrackOptions] = useState([]);
  const [trackPicker, setTrackPicker] = useState(false);
  const [pickedTrack, setPickedTrack] = useState(null);
  const [similarLoading, setSimilarLoading] = useState(false);
  const [similar, setSimilar] = useState([]);
  const lookupTimer = useRef(null);

  // Quick mixes — derived from /library/stats
  const [stats, setStats] = useState(null);

  useEffect(() => {
    const col = activeCollection ? `?collection_name=${encodeURIComponent(activeCollection)}` : '';
    apiFetch(`/library/stats${col}`).then(setStats).catch(()=>{});
  }, [activeCollection]);

  const lookupTracks = async (q) => {
    if (!q.trim()) { setTrackOptions([]); setTrackPicker(false); return; }
    const col = activeCollection ? `&collection_name=${encodeURIComponent(activeCollection)}` : '';
    try {
      const res = await apiFetch(`/library/browse?q=${encodeURIComponent(q)}&limit=6${col}`);
      const hits = (res || []).map(item => ({
        track: {
          track_id: item.track_id,
          title: item.title,
          artist: item.artist,
          album: item.album,
          cover_art_path: item.cover_art_path,
          duration_sec: 0,
          genre: null,
          year: null,
          file_path: '',
        },
        score: item.score || 0,
      }));
      setTrackOptions(hits);
      setTrackPicker(true);
    } catch(e) { setTrackOptions([]); }
  };

  const findSimilar = async (hit) => {
    setPickedTrack(hit); setTrackPicker(false); setSimilarLoading(true); setSimilar([]);
    const seedTitle = hit.track?.title || '';
    const seedArtist = hit.track?.artist || '';
    try {
      // Use audio mode with title+artist as a CLAP-friendly query
      const q = `${seedArtist} ${seedTitle}`.trim();
      const res = await apiFetch('/search/', { method:'POST', body: JSON.stringify({
        query: q, mode:'audio', limit: 12, collection_name: activeCollection || undefined
      })});
      const filtered = (res.hits || []).filter(h => !(h.track?.title === seedTitle && h.track?.artist === seedArtist));
      setSimilar(filtered.slice(0, 10));
    } catch(e) {}
    finally { setSimilarLoading(false); }
  };

  // Quick mix presets — hardcoded query + mode per preset
  const moodPresets = [
    { id:'late', label: lang==='ru'?'Под поздний вечер':'Late night',
      q:'Song with a smooth late-night jazz with velvet female vocals and soft piano', mode:'audio', hue:265, icon:'🌙' },
    { id:'walk', label: lang==='ru'?'Для прогулки':'For a walk',
      q:'Rhythmic lofi hip-hop beat for midnight walk through city streets', mode:'audio', hue:140, icon:'⊜' },
    { id:'focus', label: lang==='ru'?'Для фокуса':'Focus',
      q:'Atmospheric ambient piano track for focused study and mental clarity', mode:'audio', hue:200, icon:'◇' },
    { id:'rain', label: lang==='ru'?'Дождь и кофе':'Rain & coffee',
      q:'Acoustic ballad with poetic lyrics about rain and autumn longing', mode:'hybrid', hue:220, icon:'☁' },
    { id:'energy', label: lang==='ru'?'Заряд энергии':'Energy boost',
      q:'Powerful rock anthem with empowering lyrics and driving electric guitar', mode:'hybrid', hue:25, icon:'⚡' },
    { id:'love', label: lang==='ru'?'Романтика':'Romance',
      q:'Dreamy synth-pop track with poetic lyrics about falling in love', mode:'hybrid', hue:340, icon:'❤' },
  ];
  const runPreset = async (p) => {
    setActivePreset(p.id); setPresetLoading(true);
    try {
      const res = await apiFetch('/search/', { method:'POST', body: JSON.stringify({
        query: p.q, mode: p.mode, limit: presetLimit, collection_name: activeCollection || undefined,
      })});
      setPresetResults(res.hits || []);
    } catch(e) { setPresetResults([]); }
    finally { setPresetLoading(false); }
  };

  const card = (children, extra={}) => (
    <div className={ske('panel', isDark)} style={{ padding:'24px 26px', borderRadius:'18px', ...extra }}>
      {children}
    </div>
  );
  const blockTitle = (kicker, title, accent) => (
    <div style={{ marginBottom:'20px' }}>
      <div className="mono" style={{ fontSize:'14px', color:c.textSubtle, letterSpacing:'0.22em', marginBottom:'6px' }}>{kicker}</div>
      <div className="serif" style={{ fontSize:'30px', lineHeight:'1', letterSpacing:'-0.02em', color:c.text }}>
        {title}{accent && <i style={{ color: 'oklch(62% 0.2 275)' }}> {accent}</i>}
      </div>
    </div>
  );

  return (
    <div style={{ flex:1, display:'flex', flexDirection:'column', overflow:'hidden', background:c.bg }}>
      <SectionHeader
        isDark={isDark} lang={lang}
        kicker={lang==='ru'?'РАЗДЕЛ 02 · РЕКОМЕНДАЦИИ':'SECTION 02 · RECOMMEND'}
        title={lang==='ru'?'Что включить':"What to play"}
        accent={lang==='ru'?'сегодня':'tonight'}
      />

      <div style={{ flex:1, overflowY:'auto', padding:'30px 36px 60px' }}>
        <div style={{ maxWidth:'1180px', margin:'0 auto', display:'flex', flexDirection:'column', gap:'28px' }}>

          {/* ── 1. QUICK MIXES — preset buttons + slider + results ── */}
          {card(<>
            {blockTitle(
              lang==='ru'?'01 · БЫСТРЫЕ МИКСЫ':'01 · QUICK MIXES',
              lang==='ru'?'Подбери':'Pick',
              lang==='ru'?'настроение':'a mood',
            )}
            <div style={{ display:'grid', gridTemplateColumns:'repeat(auto-fill, minmax(180px, 1fr))', gap:'12px', marginBottom:'20px' }}>
              {moodPresets.map(p => {
                const active = activePreset === p.id;
                const accent = `oklch(62% 0.18 ${p.hue})`;
                return (
                  <button key={p.id} onClick={() => runPreset(p)}
                    className={active ? '' : ske('btn', isDark)}
                    style={{
                      padding:'18px 18px', borderRadius:'14px',
                      display:'flex', flexDirection:'column', alignItems:'flex-start', gap:'10px',
                      cursor:'pointer', textAlign:'left', position:'relative', overflow:'hidden',
                      background: active
                        ? `linear-gradient(180deg, ${accent.replace(')', ' / 0.18)')} 0%, ${accent.replace(')', ' / 0.07)')} 100%)`
                        : undefined,
                      boxShadow: active
                        ? `inset 0 0 0 1.5px ${accent.replace(')', ' / 0.5)')}, 0 0 30px ${accent.replace(')', ' / 0.3)')}`
                        : undefined,
                      transition:'all 0.25s',
                    }}>
                    <div style={{
                      width:'40px', height:'40px', borderRadius:'10px',
                      display:'flex', alignItems:'center', justifyContent:'center',
                      fontSize:'18px',
                      background: `${accent.replace(')', ' / 0.16)')}`,
                      color: accent,
                      boxShadow: isDark ? 'inset 0 1px 0 rgba(255,255,255,0.08)' : 'inset 0 1px 0 rgba(255,255,255,0.85)',
                    }}>{p.icon}</div>
                    <div className="serif" style={{ fontSize:'20px', lineHeight:'1.05', letterSpacing:'-0.01em', color:c.text }}>
                      {p.label}
                    </div>
                    <div className="mono" style={{ fontSize:'14px', color:c.textSubtle, letterSpacing:'0.16em' }}>
                      {active ? (presetLoading ? (lang==='ru'?'ПОДБОР…':'MIXING…') : (lang==='ru'?'АКТИВНО':'ACTIVE')) : (lang==='ru'?'НАЖАТЬ':'TAP')}
                    </div>
                  </button>
                );
              })}
            </div>

            {/* Slider — track count */}
            <div style={{ display:'flex', alignItems:'center', gap:'16px', marginBottom:'18px' }}>
              <span className="mono" style={{ fontSize:'14px', color:c.textSubtle, letterSpacing:'0.16em', minWidth:'100px' }}>
                {lang==='ru'?'КОЛИЧЕСТВО':'TRACK COUNT'}
              </span>
              <input type="range" min={5} max={20} value={presetLimit}
                onChange={e => setPresetLimit(parseInt(e.target.value))}
                style={{ flex:1, accentColor: 'oklch(60% 0.18 270)' }} />
              <span className="mono" style={{ fontSize:'14px', color:c.amber, minWidth:'30px', textAlign:'right' }}>
                {presetLimit}
              </span>
            </div>

            {/* Results */}
            {presetLoading && (
              <div style={{ display:'flex', flexDirection:'column', gap:'8px', animation:'fadeIn 0.3s ease' }}>
                {[1,2,3].map(i => (
                  <div key={i} style={{ height:'62px', borderRadius:'12px',
                    background: isDark?'rgba(255,255,255,0.03)':'rgba(0,0,0,0.025)',
                    boxShadow: isDark?'inset 0 1px 2px rgba(0,0,0,0.4)':'inset 0 1px 2px rgba(40,30,60,0.06)',
                    animation:`pulse 1.4s ${i*0.1}s ease-in-out infinite` }} />
                ))}
              </div>
            )}
            {!presetLoading && presetResults.length > 0 && (
              <div style={{ display:'flex', flexDirection:'column', gap:'2px', animation:'fadeIn 0.4s ease' }}>
                <div className="mono" style={{ fontSize:'14px', color:c.textSubtle, letterSpacing:'0.22em', padding:'4px 0 8px' }}>
                  {presetResults.length} {lang==='ru'?'ТРЕКОВ В МИКСЕ':'TRACKS IN THE MIX'}
                </div>
                {presetResults.map((h, i) => <ResultCard key={i} hit={h} isDark={isDark} c={c} compact onPlay={() => onPlayTrack && onPlayTrack(h, presetResults)} />)}
              </div>
            )}
            {!presetLoading && !presetResults.length && activePreset && (
              <div className="serif" style={{ fontSize:'14px', color:c.textSubtle, fontStyle:'italic', textAlign:'center', padding:'24px' }}>
                {lang==='ru'?'Ничего не нашлось':'No tracks found'}
              </div>
            )}
          </>)}

          {/* ── 3. TRACK PICKER → SIMILAR ── */}
          {card(<>
            {blockTitle(
              lang==='ru'?'02 · ПОХОЖЕЕ ПО ТРЕКУ':'02 · SIMILAR TO A TRACK',
              lang==='ru'?'Выбери':'Pick',
              lang==='ru'?'трек':'a track',
            )}
            <div className={ske('inset', isDark)} style={{ padding:'10px 14px', borderRadius:'14px', display:'flex', gap:'10px', alignItems:'center', position:'relative' }}>
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke={c.textSubtle} strokeWidth="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-5.5-5.5"/></svg>
              <input value={trackQuery} onChange={e=>{ const v=e.target.value; setTrackQuery(v); clearTimeout(lookupTimer.current); lookupTimer.current=setTimeout(()=>lookupTracks(v),250); }}
                placeholder={lang==='ru'?'название или артист…':'title or artist…'}
                style={{ flex:1, padding:'8px 0', border:'none', background:'transparent', color:c.text, fontSize:'14px', outline:'none' }} />
              {pickedTrack && (
                <button onClick={() => { setPickedTrack(null); setSimilar([]); setTrackQuery(''); }} className="mono"
                  style={{ fontSize:'14px', color:c.textSubtle, letterSpacing:'0.12em' }}>×&nbsp;{lang==='ru'?'СБРОС':'RESET'}</button>
              )}
              {trackPicker && trackOptions.length > 0 && (
                <div className={ske('panel', isDark)} style={{
                  position:'absolute', top:'calc(100% + 6px)', left:0, right:0, zIndex:5, borderRadius:'12px', overflow:'hidden',
                  maxHeight:'300px', overflowY:'auto', animation:'fadeIn 0.18s ease',
                }}>
                  {trackOptions.map((h,i) => (
                    <div key={i} onClick={() => findSimilar(h)} style={{ cursor:'pointer' }}>
                      <ResultCard hit={h} isDark={isDark} c={c} compact onPlay={() => onPlayTrack && onPlayTrack(h, similar)} />
                    </div>
                  ))}
                </div>
              )}
            </div>

            {pickedTrack && (
              <div style={{ marginTop:'18px', display:'grid', gridTemplateColumns:'auto 1fr', gap:'18px', alignItems:'center', animation:'fadeIn 0.3s ease' }}>
                <AlbumCover title={pickedTrack.track?.title} artist={pickedTrack.track?.artist} size={70} isDark={isDark} coverPath={pickedTrack.track?.cover_art_path} />
                <div>
                  <div className="mono" style={{ fontSize:'14px', color:c.textSubtle, letterSpacing:'0.22em', marginBottom:'4px' }}>
                    {lang==='ru'?'ЗАПРОС':'QUERY'}
                  </div>
                  <div className="serif" style={{ fontSize:'24px', letterSpacing:'-0.01em', color:c.text, lineHeight:'1.1' }}>
                    {pickedTrack.track?.title}
                  </div>
                  <div className="serif" style={{ fontSize:'15px', color:c.textMuted, fontStyle:'italic', marginTop:'2px' }}>
                    {pickedTrack.track?.artist}
                  </div>
                </div>
              </div>
            )}

            {pickedTrack && (
              <div style={{ marginTop:'20px' }}>
                <div className="mono" style={{ fontSize:'14px', color:c.textSubtle, letterSpacing:'0.22em', marginBottom:'12px' }}>
                  {similarLoading
                    ? (lang==='ru'?'ПОДБОР ПОХОЖИХ…':'FINDING SIMILAR…')
                    : (lang==='ru'?`ТОП-${similar.length} ПОХОЖИХ`:`TOP ${similar.length} SIMILAR`)}
                </div>
                {similarLoading ? (
                  <div style={{ display:'flex', flexDirection:'column', gap:'8px' }}>
                    {[1,2,3,4,5].map(i => (
                      <div key={i} style={{ height:'62px', borderRadius:'12px',
                        background: isDark?'rgba(255,255,255,0.03)':'rgba(0,0,0,0.025)',
                        boxShadow: isDark?'inset 0 1px 2px rgba(0,0,0,0.4)':'inset 0 1px 2px rgba(40,30,60,0.06)',
                        animation:`pulse 1.4s ${i*0.1}s ease-in-out infinite` }} />
                    ))}
                  </div>
                ) : similar.length > 0 ? (
                  <div style={{ display:'flex', flexDirection:'column', gap:'2px' }}>
                    {similar.map((h,i) => <ResultCard key={i} hit={h} isDark={isDark} c={c} compact onPlay={() => onPlayTrack && onPlayTrack(h, similar)} />)}
                  </div>
                ) : (
                  <div className="serif" style={{ fontSize:'14px', color:c.textSubtle, fontStyle:'italic', textAlign:'center', padding:'24px' }}>
                    {lang==='ru'?'Ничего похожего не нашлось':'No similar tracks found'}
                  </div>
                )}
              </div>
            )}
          </>)}

        </div>
      </div>
    </div>
  );
}

// ─── VU Meter (semicircle gauge) ──────────────────────────────────────────────
function VUMeter({ value, max=100, label, sub, isDark, hue=265, size=180 }) {
  const c = useColors(isDark);
  const pct = Math.max(0, Math.min(1, (value || 0) / (max || 1)));
  const angle = -90 + pct * 180; // -90deg → +90deg
  const accent = `oklch(62% 0.18 ${hue})`;
  return (
    <div style={{ width:size, position:'relative', display:'flex', flexDirection:'column', alignItems:'center', gap:'10px' }}>
      <div className={ske('display', isDark)} style={{
        width: size, height: size * 0.65, borderRadius:`${size*0.6}px ${size*0.6}px 12px 12px`,
        position:'relative', overflow:'hidden',
        display:'flex', alignItems:'flex-end', justifyContent:'center',
        padding:'0 0 8px',
      }}>
        {/* tick marks */}
        <svg width={size-16} height={size*0.55} viewBox={`-50 -50 100 55`} style={{ position:'absolute', bottom:'8px', left:'8px' }}>
          {[...Array(11)].map((_,i) => {
            const a = -90 + (i / 10) * 180;
            const r1 = 38, r2 = i % 5 === 0 ? 44 : 41;
            const x1 = r1 * Math.cos(a * Math.PI / 180);
            const y1 = r1 * Math.sin(a * Math.PI / 180);
            const x2 = r2 * Math.cos(a * Math.PI / 180);
            const y2 = r2 * Math.sin(a * Math.PI / 180);
            return <line key={i} x1={x1} y1={y1} x2={x2} y2={y2}
              stroke={i >= 7 ? c.amber : (i >= 9 ? 'oklch(58% 0.21 25)' : (isDark?'rgba(255,255,255,0.18)':'rgba(0,0,0,0.18)'))}
              strokeWidth={i % 5 === 0 ? 1.4 : 0.8} />;
          })}
          {/* arc gradient */}
          <path d={`M -42 0 A 42 42 0 0 1 42 0`} fill="none"
            stroke={`${accent.replace(')', ' / 0.18)')}`} strokeWidth="1.5" />
        </svg>
        {/* needle */}
        <div className="needle" style={{
          position:'absolute', left:'50%', bottom:'8px',
          width:'2px', height: size*0.42, marginLeft:'-1px',
          background: `linear-gradient(180deg, ${accent}, ${accent.replace(')', ' / 0.6)')})`,
          borderRadius:'2px',
          transform:`rotate(${angle}deg)`,
          transformOrigin: '50% 100%',
          boxShadow: `0 0 8px ${accent.replace(')', ' / 0.6)')}`,
        }} />
        {/* needle pivot */}
        <div style={{
          position:'absolute', left:'50%', bottom:'4px', width:'12px', height:'12px',
          marginLeft:'-6px', borderRadius:'50%',
          background: 'radial-gradient(circle at 30% 30%, #555, #1a1a1a)',
          boxShadow: 'inset 0 1px 0 rgba(255,255,255,0.2), 0 1px 3px rgba(0,0,0,0.6)',
        }} />
        {/* numeric readout */}
        <div className="mono" style={{
          position:'absolute', top:'18px', left:0, right:0, textAlign:'center',
          fontSize:'24px', color: c.amber, letterSpacing:'0.05em',
          textShadow: `0 0 12px ${c.amberGlow}`,
        }}>

      </div>
      <div style={{ textAlign:'center' }}>
        <div className="mono" style={{ fontSize:'14px', letterSpacing:'0.22em', color:c.textSubtle }}>{label}</div>
        {sub && <div className="serif" style={{ fontSize:'14px', color:c.textMuted, fontStyle:'italic', marginTop:'2px' }}>{sub}</div>}
      </div>
    </div>
  );
}

// ─── LLM bridge: generate insights from stats ────────────────────────────────
// [Planned feature] Replace with real LLM endpoint (POST /api/v1/insights) that
// accepts stats + lang and returns personalized narrative insights via LLM.
// Current implementation uses template-based insights from /library/stats data.
function generateInsights(stats, lang) {
  if (!stats || !stats.total_tracks) return [];
  const t = lang === 'ru';
  const out = [];

  // 1. Dominant genre
  if (stats.genres?.length) {
    const g = stats.genres[0];
    out.push({
      icon: '🎸',
      iconBg: 'oklch(60% 0.18 270 / 0.15)',
      title: t ? 'Доминирующий жанр' : 'Dominant genre',
      desc: t
        ? `${g.genre || '—'} — ${g.pct}% всей коллекции (${g.count} треков). Ядро вашего музыкального вкуса.`
        : `${g.genre || '—'} makes up ${g.pct}% of your library (${g.count} tracks). The core of your musical taste.`,
    });
  }

  // 2. Top artist
  if (stats.top_artists?.length) {
    const a = stats.top_artists[0];
    out.push({
      icon: '🎤',
      iconBg: 'oklch(60% 0.18 310 / 0.15)',
      title: t ? 'Ваш топ-артист' : 'Your top artist',
      desc: t
        ? `${a.artist || '—'} — ${a.count} треков. Самый коллекционируемый исполнитель в вашей библиотеке.`
        : `${a.artist || '—'} — ${a.count} tracks. Your most-collected artist across the entire library.`,
    });
  }

  // 3. Chronology (year range)
  if (stats.year_range) {
    const yr = stats.year_range;
    const minY = yr.min ?? yr[0];
    const maxY = yr.max ?? yr[1];
    if (minY && maxY) {
      const span = maxY - minY;
      out.push({
        icon: '📅',
        iconBg: 'oklch(72% 0.13 75 / 0.15)',
        title: t ? 'Хронология коллекции' : 'Library timeline',
        desc: t
          ? `От ${minY} до ${maxY} — ${span} лет музыки. Ваша коллекция охватывает ${span > 30 ? 'несколько поколений музыки' : 'значительный период музыкальной истории'}.`
          : `From ${minY} to ${maxY} — ${span} years of music. Your library spans ${span > 30 ? 'several generations of music' : 'a significant period of music history'}.`,
      });
    }
  }

  // 4. Total listening time
  if (stats.total_tracks && stats.duration_buckets?.length) {
    const avgSec = stats.duration_buckets.reduce((s, d) => {
      const parts = (d.range || '').split('-').map(Number);
      if (parts.length === 2 && !isNaN(parts[0]) && !isNaN(parts[1])) {
        return s + ((parts[0] + parts[1]) / 2) * d.count;
      }
      return s;
    }, 0) / Math.max(1, stats.total_tracks);
    const totalSec = avgSec * stats.total_tracks;
    const totalHrs = Math.round(totalSec / 3600);
    const days = Math.floor(totalHrs / 24);
    const hrs = totalHrs % 24;
    out.push({
      icon: '⏱',
      iconBg: 'oklch(70% 0.15 142 / 0.25)',
      title: t ? 'Общее время музыки' : 'Total listening time',
      desc: t
        ? `${totalHrs.toLocaleString('ru')} часов (${days}д ${hrs}ч) непрерывного прослушивания. Средний трек: ${secsToMMSS(avgSec)}.`
        : `${totalHrs.toLocaleString('en')} hours (${days}d ${hrs}h) of continuous playback. Average track: ${secsToMMSS(avgSec)}.`,
    });
  }

  // 5. Favorite decade
  if (stats.decades?.length) {
    const peak = stats.decades.reduce((p, d) => d.count > (p?.count || 0) ? d : p, null);
    if (peak) {
      out.push({
        icon: '🎯',
        iconBg: 'oklch(60% 0.18 25 / 0.15)',
        title: t ? 'Любимое десятилетие' : 'Favorite decade',
        desc: t
          ? `${peak.decade}-е — ваше пиковое десятилетие (${peak.count} треков, ${peak.pct}% коллекции).`
          : `${peak.decade}s is your peak decade (${peak.count} tracks, ${peak.pct}% of your library).`,
      });
    }
  }

  return out;
}

                </div>
              </div>
              <Segmented isDark={isDark} value={activePairsTab} onChange={setActivePairsTab}
                options={[
                  { value:'similar', label:lang==='ru'?'ПОХОЖИЕ ≈':'SIMILAR ≈' },
                  { value:'dissimilar', label:lang==='ru'?'РАЗНЫЕ ≠':'DIFFERENT ≠' },
                ]} />
            </div>

            {(() => {
              if (topPairsLoading) {
                return <div style={{ display:'flex', flexDirection:'column', gap:'10px' }}>
                  {[1,2,3,4,5].map(i => (
                    <div key={i} style={{ height:'70px', borderRadius:'14px',
                      background: isDark?'rgba(255,255,255,0.03)':'rgba(0,0,0,0.025)',
                      animation:`pulse 1.4s ${i*0.1}s ease-in-out infinite` }} />
                  ))}
                </div>;
              }
              const pairs = topPairs?.[activePairsTab] || [];
              const top = pairs
                .map(p => ({ main:p, best: p[`top_${activePairsTab}`]?.[0] }))
                .filter(x => x.best)
                .sort((a,b) => activePairsTab === 'similar' ? b.best.score - a.best.score : a.best.score - b.best.score);
              const seen = new Set();
              const top5 = [];
              for (const item of top) {
                const a = item.main.track_id || item.main.song;
                const b = item.best.track_id || item.best.name;
                const k = a < b ? `${a}|${b}` : `${b}|${a}`;
                if (seen.has(k)) continue;
                seen.add(k); top5.push(item);
                if (top5.length === 5) break;
              }

              if (top5.length === 0) {
                return <div className="serif" style={{ fontSize:'15px', color:c.textSubtle, fontStyle:'italic', textAlign:'center', padding:'40px' }}>
                  {lang==='ru'?'Данные ещё не рассчитаны':'Data not computed yet'}
                </div>;
              }

              return (
                <div style={{ display:'flex', flexDirection:'column' }}>
                  {top5.map((pair, idx) => {
                    const score = pair.best.score || 0;
                    const display = activePairsTab === 'similar' ? score : Math.max(0, 100 - score);
                    const meterPct = Math.max(3, Math.min(100, display));
                    const hue = activePairsTab === 'similar' ? 270 : 25;
                    const accent = `oklch(62% 0.18 ${hue})`;
                    const [aA, aT] = (pair.main.song || '').split(' - ').length===2 ? pair.main.song.split(' - ') : ['—', pair.main.song];
                    const [bA, bT] = (pair.best.name || '').split(' - ').length===2 ? pair.best.name.split(' - ') : ['—', pair.best.name];
                    return (
                      <div key={idx} style={{
                        display:'grid', gridTemplateColumns:'24px 60px 1fr 100px',
                        alignItems:'center', gap:'14px',
                        padding:'14px 0',
                        borderTop: idx > 0 ? `1px solid ${c.border}` : 'none',
                        animation:`fadeIn 0.4s ease ${idx*0.05}s both`,
                      }}>
                        <span className="mono" style={{ fontSize:'14px', color:c.textSubtle, letterSpacing:'0.06em' }}>{String(idx+1).padStart(2,'0')}</span>
                        <div style={{ display:'flex', position:'relative' }}>
                          <AlbumCover title={aT} artist={aA} size={36} isDark={isDark} coverPath={pair.main.cover_art_path} />
                          <div style={{ marginLeft:'-12px' }}>
                            <AlbumCover title={bT} artist={bA} size={36} isDark={isDark} coverPath={pair.best.cover_art_path} />
                          </div>
                        </div>
                        <div style={{ minWidth:0 }}>
                          <div style={{ fontSize:'15px', color:c.text, fontWeight:'500', whiteSpace:'nowrap', overflow:'hidden', textOverflow:'ellipsis' }}>
                            {aT} <span style={{ color: accent }}>↔</span> {bT}
                          </div>
                          <div className="serif" style={{ fontSize:'14px', color:c.textMuted, fontStyle:'italic', whiteSpace:'nowrap', overflow:'hidden', textOverflow:'ellipsis', marginTop:'2px' }}>
                            {aA} · {bA}
                          </div>
                        </div>
                        <div style={{ display:'flex', flexDirection:'column', alignItems:'flex-end', gap:'5px' }}>
                          <span className="mono" style={{ fontSize:'14px', color: accent, letterSpacing:'0.04em' }}>{display.toFixed(1)}%</span>
                          <div className={ske('inset', isDark)} style={{ width:'80px', height:'4px', borderRadius:'3px', overflow:'hidden' }}>
                            <div style={{ width:`${meterPct}%`, height:'100%',
                              background:`linear-gradient(90deg, ${accent}, ${accent.replace(')', ' / 0.5)')})`,
                              boxShadow:`0 0 6px ${accent.replace(')', ' / 0.4)')}`,
                              transform:'scaleX(0)', transformOrigin:'left',
                              animation:`meterTick 0.8s cubic-bezier(.22,.9,.3,1) ${idx*0.07}s forwards` }} />
                          </div>
                        </div>
                      </div>
                    );
                  })}
                </div>
              );
            })()}
          </div>

        </div>
      </div>
    </div>
  );
}

// ─── Indexing progress (compact, 2 sections) ─────────────────────────────────
function IndexingProgress({ stepStatus, stageProgress, lang, c, isDark }) {
  const internetStages = [
    { key:'lyrics',   icon:'♪', labelRu:'Тексты',         labelEn:'Lyrics' },
    { key:'facts',    icon:'★', labelRu:'Факты',         labelEn:'Facts' },
    { key:'metadata', icon:'⌕', labelRu:'Метаданные',    labelEn:'Metadata' },
  ];
  const localStages = [
    { key:'dense',    icon:'◆', labelRu:'Dense эмбеддинги', labelEn:'Dense embeddings' },
    { key:'audio',    icon:'♫', labelRu:'CLAP аудио',     labelEn:'CLAP audio' },
  ];
  const finalStages = [
    { key:'analysis', icon:'∿', labelRu:'Анализ схожести', labelEn:'Similarity analysis' },
  ];

  const CheckIcon = ({ size=16, color }) => (
    <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke={color} strokeWidth="3" strokeLinecap="round" strokeLinejoin="round">
      <path d="M4 12l6 6L20 6"/>
    </svg>
  );

  useEffect(() => {
    let styleEl = document.getElementById('indexing-pulse-style');
    if (!styleEl) {
      styleEl = document.createElement('style');
      styleEl.id = 'indexing-pulse-style';
      document.head.appendChild(styleEl);
    }
    styleEl.textContent = '@keyframes indexing-pulse { 0%,100%{opacity:0.4;transform:scale(0.8)} 50%{opacity:1;transform:scale(1)} }';
  }, [isDark]);

  const renderSection = (header, stages) => (
    <div style={{ display:'flex', flexDirection:'column', gap:'14px' }}>
      {header && (
        <div className="mono" style={{
          fontSize:'12px', color: c.textSubtle, letterSpacing:'0.22em',
          paddingBottom:'6px', marginBottom:'2px',
          borderBottom: `1px solid ${isDark ? 'rgba(255,255,255,0.06)' : 'rgba(0,0,0,0.08)'}`,
        }}>
          {header}
        </div>
      )}
      {stages.map(s => {
        const status = stepStatus[s.key] || 'pending';
        const active = status === 'running';
        const done = status === 'done' || status === 'completed';
        const fail = status === 'failed';
        const partial = status === 'partial';
        const accent = done ? c.green : fail ? c.red : partial ? c.amber : active ? c.amber : c.textSubtle;
        const prog = stageProgress && stageProgress[s.key];
        const pct = prog && prog.total && prog.total > 0 ? Math.max(0, Math.min(100, ((prog.current || 0) / prog.total) * 100)) : 0;
        const etaText = prog && prog.eta != null && prog.eta > 0 ? ` · ETA ${Math.round(prog.eta)}s` : '';
        const labelText = prog && prog.total != null
          ? `${prog.current || 0}/${prog.total}`
          : null;

        // Icon background
        let iconBg;
        if (done) iconBg = c.greenBg;
        else if (fail) iconBg = c.redBg;
        else if (active) iconBg = `oklch(72% 0.13 75 / 0.12)`;
        else iconBg = isDark ? 'rgba(255,255,255,0.04)' : 'rgba(0,0,0,0.04)';

        return (
          <div key={s.key} style={{ display:'flex', alignItems:'flex-start', gap:'12px' }}>
            <div style={{
              width:'35px', height:'35px', borderRadius:'10px', flexShrink:0, marginTop:'2px',
              display:'flex', alignItems:'center', justifyContent:'center',
              fontSize:'17px', color: accent, fontFamily:"'JetBrains Mono', monospace",
              background: iconBg,
              boxShadow: isDark ? 'inset 0 1px 0 rgba(255,255,255,0.05)' : 'inset 0 1px 0 rgba(255,255,255,0.85)',
            }}>
              {done ? <CheckIcon size={18} color={accent} />
                : fail ? '×'
                : active ? (
                    <span style={{
                      width:'10px', height:'10px', borderRadius:'50%',
                      background: accent,
                      animation: 'indexing-pulse 1.2s ease-in-out infinite',
                    }} />
                  )
                : s.icon}
            </div>
            <div style={{ flex:1, minWidth:0 }}>
              <div style={{ fontSize:'17px', color: c.text, fontWeight: active?'600':'500' }}>
                {lang==='ru' ? s.labelRu : s.labelEn}
              </div>
              {(active || done || partial || fail) && (
                <div style={{ display:'flex', flexDirection:'column', gap:'5px', marginTop:'6px' }}>
                  {active && (
                    <div>
                      <div style={{
                        height:'5px', borderRadius:'3px', overflow:'hidden', marginBottom:'4px',
                        background: isDark ? 'rgba(255,255,255,0.06)' : 'rgba(0,0,0,0.06)',
                      }}>
                        <div style={{
                          height:'100%', width:`${pct}%`, borderRadius:'3px',
                          background: `linear-gradient(90deg, oklch(60% 0.18 270), oklch(68% 0.2 290))`,
                          transition: 'width 0.5s ease-out',
                          boxShadow: `0 0 6px oklch(60% 0.18 270 / 0.4)`,
                        }} />
                      </div>
                      {labelText && (
                        <div className="mono" style={{ fontSize:'12px', color:c.textMuted, letterSpacing:'0.06em' }}>
                          {labelText}{etaText}
                          {prog && prog.found != null && prog.not_found != null && (
                            <span>
                              {' '}· <span style={{ color: c.green }}>{prog.found} {lang==='ru'?'найдено':'found'}</span>
                              {prog.not_found > 0 && <span>, {prog.not_found} <span style={{ color: c.amber }}>{lang==='ru'?'не найдено':'not found'}</span></span>}
                            </span>
                          )}
                        </div>
                      )}
                    </div>
                  )}
                  {done && (
                    <div>
                      <div className="mono" style={{ fontSize:'12px', color:c.green, letterSpacing:'0.06em' }}>
                        {prog && prog.message ? prog.message : (lang==='ru'?'Готово':'Done')}
                      </div>
                      {prog && prog.found != null && prog.not_found != null && (
                        <div className="mono" style={{ fontSize:'12px', color:c.textMuted, letterSpacing:'0.06em', marginTop:'2px' }}>
                          <span style={{ color: c.green }}>{prog.found} {lang==='ru'?'найдено':'found'}</span>
                          {prog.not_found > 0 && <span>, {prog.not_found} <span style={{ color: c.amber }}>{lang==='ru'?'не найдено':'not found'}</span></span>}
                        </div>
                      )}
                    </div>
                  )}
                  {partial && (
                    <div>
                      <div className="mono" style={{ fontSize:'12px', color:c.amber, letterSpacing:'0.06em' }}>
                        {prog && prog.message ? prog.message : ''}
                      </div>
                      {prog && prog.found != null && prog.not_found != null && (
                        <div className="mono" style={{ fontSize:'12px', color:c.textMuted, letterSpacing:'0.06em', marginTop:'2px' }}>
                          <span style={{ color: c.green }}>{prog.found} {lang==='ru'?'найдено':'found'}</span>
                          {prog.not_found > 0 && <span>, {prog.not_found} <span style={{ color: c.amber }}>{lang==='ru'?'не найдено':'not found'}</span></span>}
                        </div>
                      )}
                    </div>
                  )}
                  {fail && (
                    <div className="mono" style={{ fontSize:'12px', color:c.red, letterSpacing:'0.06em' }}>
                      {prog && prog.message ? prog.message : (lang==='ru'?'Ошибка':'Error')}
                    </div>
                  )}
                </div>
              )}
            </div>
          </div>
        );
      })}
    </div>
  );

  const grooveStyle = {
    padding: '6px 0',
    borderTop: `1px solid ${isDark ? 'rgba(255,255,255,0.07)' : 'rgba(0,0,0,0.09)'}`,
    borderBottom: `1px solid ${isDark ? 'rgba(255,255,255,0.025)' : 'rgba(0,0,0,0.04)'}`,
  };

  return (
    <div style={{ display:'flex', flexDirection:'column', gap:'14px' }}>
      {renderSection(
        lang==='ru' ? 'ПОИСК ДАННЫХ В ИНТЕРНЕТЕ' : 'FETCHING DATA',
        internetStages
      )}
      <div style={grooveStyle} />
      {renderSection(
        lang==='ru' ? 'ЛОКАЛЬНАЯ ИНДЕКСАЦИЯ' : 'LOCAL INDEXING',
        localStages
      )}
      {renderSection(null, finalStages)}
    </div>
  );
}

// ─── AI Indexing card (inside SettingsPanel) ──────────────────────────────────
function AIIndexingCard({ isDark, lang, activeCollection }) {
  const c = useColors(isDark);
  const [status, setStatus] = useState({ sonic_vibe: null, refined_facts: null });
  const [busy, setBusy] = useState({ sonic_vibe: false, refined_facts: false });
  const [error, setError] = useState(null);
  const pollRef = useRef(null);

  const refresh = useCallback(async () => {
    if (!activeCollection) return;
    try {
      const data = await apiFetch(`/library/ai-index/status?collection=${encodeURIComponent(activeCollection)}`);
      setStatus(data);
    } catch { /* swallow — surface via error state only if Run/Reset fails */ }
  }, [activeCollection]);

  useEffect(() => {
    refresh();
    return () => { if (pollRef.current) { clearInterval(pollRef.current); pollRef.current = null; } };
  }, [refresh]);

  const isRunning = (s) => s && s.status === 'running';
  const someRunning = isRunning(status.sonic_vibe) || isRunning(status.refined_facts);

  useEffect(() => {
    if (someRunning && !pollRef.current) {
      pollRef.current = setInterval(refresh, 3000);
    } else if (!someRunning && pollRef.current) {
      clearInterval(pollRef.current);
      pollRef.current = null;
      // One last refresh to capture the final state.
      refresh();
    }
  }, [someRunning, refresh]);

  const runJob = async (taskType) => {
    if (!activeCollection) { setError(lang === 'ru' ? 'Выбери коллекцию' : 'Pick a collection first'); return; }
    setError(null);
    setBusy(b => ({ ...b, [taskType]: true }));
    try {
      await apiFetch(`/library/ai-index/${taskType}`, {
        method: 'POST',
        body: JSON.stringify({ collection_name: activeCollection, lang }),
      });
      refresh();
    } catch (e) {
      setError(e?.message || String(e));
    } finally {
      setBusy(b => ({ ...b, [taskType]: false }));
    }
  };

  const resetCache = async (taskType) => {
    if (!activeCollection) return;
    const confirmMsg = lang === 'ru'
      ? 'Сбросить кэш для этой задачи?'
      : 'Reset cache for this task?';
    if (!window.confirm(confirmMsg)) return;
    setError(null);
    try {
      await apiFetch(
        `/library/ai-index/${taskType}/cache?collection=${encodeURIComponent(activeCollection)}`,
        { method: 'DELETE' },
      );
      refresh();
    } catch (e) {
      setError(e?.message || String(e));
    }
  };

  const fmtStatus = (s) => {
    if (!s) return lang === 'ru' ? 'Никогда не запускалась' : 'Never run';
    const skipped = s.n_skipped || 0;
    const parts = [
      `${lang === 'ru' ? 'Статус' : 'Status'}: ${s.status}`,
      `${s.n_done}/${s.n_total} ${lang === 'ru' ? 'обработано' : 'processed'}`,
    ];
    if (skipped) {
      parts.push(`${skipped} ${lang === 'ru' ? 'пропущено' : 'skipped'}`);
    }
    if (s.n_failed) {
      parts.push(`${s.n_failed} ${lang === 'ru' ? 'ошибок' : 'failed'}`);
    }
    if (s.lang) parts.push(s.lang.toUpperCase());
    return parts.join(' · ');
  };

  // Detect the "completed with zero real work" case so we can surface a
  // distinct note instead of letting "done · 0/N processed · N skipped"
  // get lost in the muted-mono line.
  const isEmptyDone = (s) =>
    s && s.status === 'done' && (s.n_done || 0) === 0 && (s.n_skipped || 0) > 0;

  const skipReasonHint = (taskType) => {
    if (taskType === 'sonic_vibe') {
      return lang === 'ru'
        ? 'Нет входных данных: ни sonic_tags, ни фактов. Сначала запусти SONIC PROMPT-PROBING и/или обогащение фактами в библиотеке.'
        : 'No inputs available: neither sonic_tags nor song facts. Run sonic prompt-probing and/or facts enrichment in the library first.';
    }
    return lang === 'ru'
      ? 'Нет фактов о треках/артистах для уточнения. Сначала обогати библиотеку фактами.'
      : 'No song or artist facts to refine. Enrich your library with facts first.';
  };

  const Row = ({ title, taskType }) => {
    const s = status[taskType];
    const running = isRunning(s);
    return (
      <div style={{ padding: '12px 0', borderBottom: `1px solid ${c.border}` }}>
        <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', gap: 10 }}>
          <div style={{ fontWeight: 600, color: c.text, fontSize: 14 }}>{title}</div>
          <div style={{ display: 'flex', gap: 8 }}>
            <button
              disabled={busy[taskType] || running || !activeCollection}
              onClick={() => runJob(taskType)}
              style={{
                padding: '6px 12px', borderRadius: 8, cursor: (busy[taskType] || running || !activeCollection) ? 'not-allowed' : 'pointer',
                fontSize: 12, fontWeight: 500,
                background: isDark ? 'rgba(124,91,255,0.18)' : 'rgba(124,91,255,0.10)',
                color: isDark ? '#cdb8ff' : '#5b3fd6',
                border: `1px solid ${isDark ? 'rgba(124,91,255,0.35)' : 'rgba(124,91,255,0.30)'}`,
                opacity: (busy[taskType] || running || !activeCollection) ? 0.5 : 1,
              }}>
              {running
                ? (lang === 'ru' ? 'Идёт…' : 'Running…')
                : (lang === 'ru' ? '▶ Запустить' : '▶ Run')}
            </button>
            <button
              onClick={() => resetCache(taskType)}
              disabled={!activeCollection}
              style={{
                padding: '6px 12px', borderRadius: 8, cursor: activeCollection ? 'pointer' : 'not-allowed',
                fontSize: 12, fontWeight: 500,
                background: 'transparent', color: c.textMuted,
                border: `1px solid ${c.border}`,
                opacity: activeCollection ? 1 : 0.5,
              }}>
              ↻ {lang === 'ru' ? 'Сброс' : 'Reset'}
            </button>
          </div>
        </div>
        <div style={{ marginTop: 6, fontSize: 11, color: c.textMuted, fontFamily: "'JetBrains Mono', monospace" }}>
          {fmtStatus(s)}
        </div>
        {isEmptyDone(s) && (
          <div style={{
            marginTop: 6, fontSize: 11, lineHeight: 1.5,
            color: 'oklch(70% 0.13 75)',
          }}>
            ⚠ {lang === 'ru'
              ? 'Завершено без реальной работы — все треки пропущены.'
              : 'Completed with no real work — every track was skipped.'}
            <br />{skipReasonHint(taskType)}
          </div>
        )}
        {s && s.error && (
          <div style={{ marginTop: 6, fontSize: 11, lineHeight: 1.5, color: 'oklch(62% 0.18 25)' }}>
            ✗ {s.error}
          </div>
        )}
      </div>
    );
  };

  return (
    <div style={{
      padding: '16px 18px', borderRadius: 12,
      border: `1px solid ${c.border}`, marginTop: 18,
      background: isDark ? 'rgba(255,255,255,0.02)' : 'rgba(0,0,0,0.02)',
    }}>
      <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'baseline', marginBottom: 6 }}>
        <div className="mono-label" style={{ color: c.textMuted, fontSize: 11, letterSpacing: '0.15em' }}>
          AI INDEXING
        </div>
        <div style={{ fontSize: 11, color: c.textSubtle }}>
          {lang === 'ru' ? 'Текущий язык' : 'Current language'}: {lang.toUpperCase()}
        </div>
      </div>
      <Row title="Sonic Vibe" taskType="sonic_vibe" />
      <Row title={lang === 'ru' ? 'Уточнённые факты' : 'Refined Facts'} taskType="refined_facts" />
      <div style={{ fontSize: 11, color: c.textMuted, marginTop: 12, lineHeight: 1.5 }}>
        ⚠ {lang === 'ru'
          ? 'AI-индексация использует текущий язык фронта. Чтобы получить результат на другом языке, смени язык и запусти повторно.'
          : 'AI indexing uses your current frontend language. To get results in another language, switch language and re-run.'}
      </div>
      {error && (
        <div style={{ marginTop: 10, fontSize: 12, color: 'oklch(62% 0.18 25)' }}>
          {error}
        </div>
      )}
    </div>
  );
}

// ─── Settings overlay (slides in from right) ─────────────────────────────────
function SettingsPanel({ isDark, lang, onClose, onCollectionsUpdate, activeCollection, onTheme, onLang, collections, onCollectionSwitch, onCollectionDelete }) {
  const c = useColors(isDark);
  const [models, setModels] = useState({});
  // Guard against legacy localStorage values: Web Storage stringifies `null` to the
  // literal string "null", which would then be sent to backend and tried as a HF
  // repo_id. Coerce any falsy/"null"/"undefined" to actual null so backend uses
  // its default model (jinaai/jina-embeddings-v2-small-en).
  const [textModel, setTextModel] = useState(() => {
    const v = localStorage.getItem('text_model');
    return (v && v !== 'null' && v !== 'undefined') ? v : null;
  });
  const [collName, setCollName] = useState('');
  const [folderPath, setFolderPath] = useState('');
  const [picking, setPicking] = useState(false);
  const [betterLyrics, setBetterLyrics] = useState(false);
  const [refineMetadata, setRefineMetadata] = useState(false);
  const [indexing, setIndexing] = useState(false);
  const [stepStatus, setStepStatus] = useState({});
  const [showModal, setShowModal] = useState(false);
  const [modalTrackCount, setModalTrackCount] = useState(null);
  const [modalError, setModalError] = useState(null);
  const [stageProgress, setStageProgress] = useState({});

  const [llmBaseUrl, setLlmBaseUrl] = useState(() => localStorage.getItem('llm_base_url') || '');
  const [llmModel, setLlmModel] = useState(() => localStorage.getItem('llm_model') || '');
  const [llmSaved, setLlmSaved] = useState(false);

  useEffect(() => {
    apiFetch('/search/models/text').then(setModels).catch(() => {});
  }, []);

  // Persist only valid model names; otherwise REMOVE the key so getItem returns
  // null next time (instead of the string "null").
  useEffect(() => {
    if (textModel && typeof textModel === 'string') {
      localStorage.setItem('text_model', textModel);
    } else {
      localStorage.removeItem('text_model');
    }
  }, [textModel]);

  const handlePick = async () => {
    setPicking(true);
    try { const res = await apiFetch('/library/pick-folder'); if (res.path) setFolderPath(res.path); }
    catch {} finally { setPicking(false); }
  };

  const handleIndex = async () => {
    if (!folderPath.trim() || indexing) return;
    const colName = collName.trim() || 'my_collection';
    setIndexing(true); setModalError(null); setModalTrackCount(null); setStageProgress({}); setShowModal(true);
    setStepStatus({ lyrics:'idle', facts:'idle', metadata:'idle', dense:'idle', audio:'idle', analysis:'idle' });
    try {
      // Only send text_model if user picked one — omit otherwise so backend
      // falls back to its default. Avoid sending the literal string "null".
      const validModel = (textModel && typeof textModel === 'string' && textModel !== 'null') ? textModel : undefined;
      const res = await apiFetch('/library/index', { method:'POST',
        body: JSON.stringify({ folder_path:folderPath, collection_name:colName, better_lyrics_quality:betterLyrics, text_model:validModel, enhance_by_musicbrainz:refineMetadata }) });
      if (res.status === 'failed') { setModalError(res.message); setIndexing(false); return; }
      if (!res.job_id) {
        setStepStatus({ metadata:'done', lyrics:'done', audio:'done', analysis:'done' });
        setModalTrackCount(res.count || 0);
        localStorage.setItem('active_collection', colName);
        onCollectionsUpdate && onCollectionsUpdate();
        return;
      }
      const evt = new EventSource(`${API}/index/progress/${res.job_id}`);
      evt.onmessage = (event) => {
        try {
          const data = JSON.parse(event.data);
          if (data.stages) {
            const statusMap = { completed: 'done', failed: 'failed', running: 'running', pending: 'pending' };
            setStepStatus(prev => {
              const newStatus = { ...prev };
              for (const [key, stage] of Object.entries(data.stages)) {
                newStatus[key] = (statusMap[stage.status] || stage.status) || 'pending';
              }
              return newStatus;
            });
            // Merge event-specific fields into the correct stage
            if (data.stage && data.stages[data.stage]) {
              const ev = data.stages[data.stage];
              if (data.current !== undefined) ev.current = data.current;
              if (data.total !== undefined) ev.total = data.total;
              if (data.eta_seconds !== undefined) ev.eta_seconds = data.eta_seconds;
              if (data.message !== undefined) ev.message = data.message;
            }
            setStageProgress(prev => {
              const newProg = { ...prev };
              for (const [key, stage] of Object.entries(data.stages)) {
                newProg[key] = {
                  current: stage.current ?? prev[key]?.current ?? 0,
                  total: stage.total ?? prev[key]?.total ?? 0,
                  eta: stage.eta_seconds ?? prev[key]?.eta ?? null,
                  message: stage.message ?? prev[key]?.message ?? null,
                  found: stage.found ?? prev[key]?.found ?? null,
                  not_found: stage.not_found ?? prev[key]?.not_found ?? null,
                };
              }
              return newProg;
            });
          }
          if (data.overall_status === 'completed') {
            evt.close();
            setStepStatus(prev => ({ ...prev, ...Object.fromEntries(
              Object.keys(prev).filter(k => prev[k] === 'pending').map(k => [k, 'done'])
            )}));
            setModalTrackCount(data.stages?.lyrics?.current || data.stages?.metadata?.current || 0);
            setIndexing(false);
            localStorage.setItem('active_collection', colName);
            onCollectionsUpdate && onCollectionsUpdate();
          } else if (data.overall_status === 'failed') {
            evt.close();
            setModalError(data.error || data.message);
            setIndexing(false);
          }
        } catch {}
      };
      evt.onerror = () => { evt.close(); if (indexing) { setModalError(lang==='ru'?'Соединение потеряно':'Connection lost'); setIndexing(false); } };
    } catch (e) { setModalError(e.message); setIndexing(false); }
  };

  const saveLLM = () => {
    localStorage.setItem('llm_base_url', llmBaseUrl.trim());
    localStorage.setItem('llm_model',    llmModel.trim());

// ─── Onboarding (compact, themed) ─────────────────────────────────────────────
function OnboardingScreen({ isDark, lang, onDone, onLang, onTheme }) {
  const c = useColors(isDark);
  const [folderPath, setFolderPath] = useState('');
  const [collName, setCollName] = useState('my_collection');
  const [betterLyrics, setBetterLyrics] = useState(false);
  const [refineMetadata, setRefineMetadata] = useState(false);
  const [picking, setPicking] = useState(false);
  const [error, setError] = useState('');
  const [indexing, setIndexing] = useState(false);
  const [stepStatus, setStepStatus] = useState({});
  const [showModal, setShowModal] = useState(false);
  const [modalTrackCount, setModalTrackCount] = useState(null);
  const [modalError, setModalError] = useState(null);
  const [stageProgress, setStageProgress] = useState({});

  const handlePick = async () => {
    setPicking(true); setError('');
    try { const res = await apiFetch('/library/pick-folder'); if (res.path) setFolderPath(res.path); else setError(lang==='ru'?'Папка не выбрана':'No folder picked'); }
    catch (e) { setError(e.message); } finally { setPicking(false); }
  };

  const handleIndex = async () => {
    if (!folderPath || indexing) return;
    setIndexing(true); setShowModal(true); setModalError(null); setModalTrackCount(null); setStageProgress({});
    setStepStatus({ lyrics:'idle', facts:'idle', metadata:'idle', dense:'idle', audio:'idle', analysis:'idle' });
    const c = collName.trim() || 'my_collection';
    try {
      const res = await apiFetch('/library/index', { method:'POST',
        body: JSON.stringify({ folder_path:folderPath, collection_name:c, better_lyrics_quality:betterLyrics, enhance_by_musicbrainz:refineMetadata }) });
      if (res.status === 'failed') { setModalError(res.message); setIndexing(false); return; }
      if (!res.job_id) {
        setStepStatus({ metadata:'done', lyrics:'done', audio:'done', analysis:'done' });
        setModalTrackCount(res.count || 0);
        localStorage.setItem('active_collection', c);
        setTimeout(onDone, 800); return;
      }
      const evt = new EventSource(`${API}/index/progress/${res.job_id}`);
      evt.onmessage = (event) => {
        try {
          const data = JSON.parse(event.data);
          if (data.stages) {
            const statusMap = { completed: 'done', failed: 'failed', running: 'running', pending: 'pending' };
            setStepStatus(prev => {
              const newStatus = { ...prev };
              for (const [key, stage] of Object.entries(data.stages)) {
                newStatus[key] = (statusMap[stage.status] || stage.status) || 'pending';
              }
              return newStatus;
            });
            // Merge event-specific fields into the correct stage
            if (data.stage && data.stages[data.stage]) {
              const ev = data.stages[data.stage];
              if (data.current !== undefined) ev.current = data.current;
              if (data.total !== undefined) ev.total = data.total;
              if (data.eta_seconds !== undefined) ev.eta_seconds = data.eta_seconds;
              if (data.message !== undefined) ev.message = data.message;
            }
            setStageProgress(prev => {
              const newProg = { ...prev };
              for (const [key, stage] of Object.entries(data.stages)) {
                newProg[key] = {
                  current: stage.current ?? prev[key]?.current ?? 0,
                  total: stage.total ?? prev[key]?.total ?? 0,
                  eta: stage.eta_seconds ?? prev[key]?.eta ?? null,
                  message: stage.message ?? prev[key]?.message ?? null,
                  found: stage.found ?? prev[key]?.found ?? null,
                  not_found: stage.not_found ?? prev[key]?.not_found ?? null,
                };
              }
              return newProg;
            });
          }
          if (data.overall_status === 'completed') {
            evt.close();
            setStepStatus(prev => ({ ...prev, ...Object.fromEntries(
              Object.keys(prev).filter(k => prev[k] === 'pending').map(k => [k, 'done'])

            setModalTrackCount(data.stages?.lyrics?.current || data.stages?.metadata?.current || 0);

          }
        } catch {}

function getSongFacts(track, lang) {
  if (!track) return [];
  const t = lang === 'ru';
  const hue = ((track.title?.charCodeAt(0)||65)*37 + (track.artist?.charCodeAt(0)||65)*17) % 360;
  const keys = ['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
  const modes = ['Major','Minor'];
  const key = keys[Math.abs(track.title?.charCodeAt(0)||0) % keys.length];
  const mode = modes[Math.abs(track.artist?.charCodeAt(0)||0) % 2];
  const bpm = 80 + Math.abs(track.title?.charCodeAt(1)||0) % 60;
  const moods = ['Melancholic','Energetic','Dreamy','Dark','Euphoric','Nostalgic','Intimate','Cinematic'];
  const mood = moods[Math.abs(track.title?.charCodeAt(2)||0) % moods.length];
  const lang2 = ['English','Russian','Japanese','Korean','French'];
  const langVal = lang2[Math.abs(track.artist?.charCodeAt(1)||0) % lang2.length];

  return [
    { icon: '♪', label: t?'Тональность':'Key', value: `${key} ${mode}` },
    { icon: '⏱', label: t?'Темп':'BPM', value: `${bpm} BPM` },
    { icon: '◐', label: t?'Настроение':'Mood', value: mood },
    { icon: 'μ', label: t?'Жанр':'Genre', value: track.genre || 'Indie' },
    { icon: '📅', label: t?'Год':'Year', value: track.year || '—' },
    { icon: '🌐', label: t?'Язык':'Lang', value: langVal },
    { icon: '⏱', label: t?'Длительность':'Length', value: track.duration ? secsToMMSS(track.duration) : '—' },
    { icon: '♫', label: t?'Альбом':'Album', value: track.album || '—' },
  ];
}
