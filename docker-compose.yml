services:
  # ── MusiX application: FastAPI serving API + SPA frontend + static covers ──
  musix:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: musix
    restart: unless-stopped
    ports:
      # The only port clients need — frontend and API share one process.
      - "8000:8000"
    env_file:
      # Optional so `docker compose up -d` works before you create .env
      # (the app falls back to a dev JWT secret + disabled LLM until then).
      - path: .env
        required: false
    # Reach an LLM (LM Studio / Ollama / OpenAI-compat) running on the HOST.
    # Docker Desktop (Mac/Windows) provides `host.docker.internal` for free, but
    # the Linux engine does NOT — without this mapping the container resolving an
    # admin-configured `http://host.docker.internal:<port>/v1` fails with
    # "[Errno -2] Name or service not known". `host-gateway` is a special value
    # (Docker 20.10+) that resolves to the host's gateway IP.
    # NOTE: the host LLM must listen on 0.0.0.0 (not just 127.0.0.1), or the
    # container reaches the host but the port refuses the connection.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      # Reach Qdrant by service name over the Compose network. Set here too so
      # it holds even without a .env file.
      - QDRANT_URL=http://qdrant:6333
      # Reach SearXNG by service name too — the host-published localhost:8088 is
      # NOT visible from inside this container, only the internal 8080 port is.
      - SEARXNG_URL=http://searxng:8080
      # ── Prevent HTTP_PROXY from leaking into container environment ──
      # docker-compose auto-loads .env into container env. Libraries like httpx
      # and QdrantClient auto-detect HTTP_PROXY from env and would route ALL
      # requests through the proxy, including internal Docker traffic (Qdrant,
      # SearXNG). We override these to empty so only code that explicitly calls
      # get_proxy() (which reads .env directly) uses the proxy.
      - HTTP_PROXY=
      - http_proxy=
      - HTTPS_PROXY=
      - https_proxy=
      # Opt-in: allow non-owner MEMBERS to index the mounted music folder in place
      # (index-by-reference, no upload/copy). Must equal the CONTAINER side of the
      # music bind-mount below. Unset = owner-only folder indexing (default, safe).
      # Only point this at a TRUSTED, ideally read-only mount.
      # - MEMBER_INDEX_ROOT=/music
    volumes:
      # Bind mounts — visible/editable from the host (Windows project layout):
      - ./media:/app/media                      # client uploads (server mode)
      - ./cache:/app/cache                      # SQLite metadata.db, facts, transcoded
      - ./weights:/app/weights                  # model weights
      - ./frontend/covers:/app/frontend/covers  # extracted album/artist art
      - ./.env:/app/.env:ro                     # proxy_config reads HTTP_PROXY directly from .env
      # Named volume — keeps downloaded HF/CLAP models across rebuilds:
      - hf-cache:/app/.hf-cache
      # Live-stack tests: the image excludes tests/ (.dockerignore), so bind the
      # suite + pytest config read-only. scripts/run_docker_tests.sh execs
      # `pytest tests/docker/` inside this container (real Qdrant + real models).
      - ./tests:/app/tests:ro
      - ./pytest.ini:/app/pytest.ini:ro
      # Index music WITHOUT copying it onto the server: bind-mount an external
      # folder (read-only) and index it in place ("by reference"). Pair this with
      # MEMBER_INDEX_ROOT below so members (not just the owner) can index it.
      # Mount a path that exists on your host, e.g.:
      - "/mnt/music:/music"          # Linux (see fstab note in README)
      # - "D:/Music:/music:ro"            # Windows host
    depends_on:
      qdrant:
        condition: service_healthy
      searxng:
        condition: service_started
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "3"

  # ── Qdrant: vector database (not published to host; app reaches it in-net) ──
  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant
    restart: unless-stopped
    expose:
      - "6333"
    ports:
    - "6333:6333"
    volumes:
      - qdrant-storage:/qdrant/storage
    healthcheck:
      # The qdrant image has bash but no curl/wget — use bash's /dev/tcp to
      # confirm the REST port is accepting connections.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/6333"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "1m"
        max-file: "1"

  # ── SearXNG: metasearch (unchanged) ─────────────────────────────────────────
  searxng:
    image: searxng/searxng:latest
    container_name: searxng
    restart: unless-stopped
    ports:
      - "8088:8080"
    volumes:
      - ./searxng:/etc/searxng
      - searxng-cache:/var/cache/searxng
    environment:
      - SEARXNG_BASE_URL=http://localhost:8088/
      - UWSGI_WORKERS=4
      - UWSGI_THREADS=4
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
    logging:
      driver: "json-file"
      options:
        max-size: "1m"
        max-file: "1"

volumes:
  searxng-cache:
  qdrant-storage:
  hf-cache:
