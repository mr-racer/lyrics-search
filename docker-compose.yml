services:
  # ── MusiX application: FastAPI serving API + SPA frontend + static covers ──
  musix:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: musix
    restart: unless-stopped
    ports:
      # The only port clients need — frontend and API share one process.
      - "8000:8000"
    env_file:
      # Optional so `docker compose up -d` works before you create .env
      # (the app falls back to a dev JWT secret + disabled LLM until then).
      - path: .env
        required: false
    environment:
      # Reach Qdrant by service name over the Compose network. Set here too so
      # it holds even without a .env file.
      - QDRANT_URL=http://qdrant:6333
      # ── Prevent HTTP_PROXY from leaking into container environment ──
      # docker-compose auto-loads .env into container env. Libraries like httpx
      # and QdrantClient auto-detect HTTP_PROXY from env and would route ALL
      # requests through the proxy, including internal Docker traffic (Qdrant,
      # SearXNG). We override these to empty so only code that explicitly calls
      # get_proxy() (which reads .env directly) uses the proxy.
      - HTTP_PROXY=
      - http_proxy=
      - HTTPS_PROXY=
      - https_proxy=
    volumes:
      # Bind mounts — visible/editable from the host (Windows project layout):
      - ./media:/app/media                      # client uploads (server mode)
      - ./cache:/app/cache                      # SQLite metadata.db, facts, transcoded
      - ./weights:/app/weights                  # model weights
      - ./frontend/covers:/app/frontend/covers  # extracted album/artist art
      - ./.env:/app/.env:ro                     # proxy_config reads HTTP_PROXY directly from .env
      # Named volume — keeps downloaded HF/CLAP models across rebuilds:
      - hf-cache:/app/.hf-cache
      # Optional: mount an external music folder (read-only) to index by link.
      # Use a path that exists on your host, e.g.:
      # - "D:/Music:/music:ro"
    depends_on:
      qdrant:
        condition: service_healthy
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "3"

  # ── Qdrant: vector database (not published to host; app reaches it in-net) ──
  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant
    restart: unless-stopped
    expose:
      - "6333"
    volumes:
      - qdrant-storage:/qdrant/storage
    healthcheck:
      # The qdrant image has bash but no curl/wget — use bash's /dev/tcp to
      # confirm the REST port is accepting connections.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/6333"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "1m"
        max-file: "1"

  # ── SearXNG: metasearch (unchanged) ─────────────────────────────────────────
  searxng:
    image: searxng/searxng:latest
    container_name: searxng
    restart: unless-stopped
    ports:
      - "8088:8080"
    volumes:
      - ./searxng:/etc/searxng
      - searxng-cache:/var/cache/searxng
    environment:
      - SEARXNG_BASE_URL=http://localhost:8088/
      - UWSGI_WORKERS=4
      - UWSGI_THREADS=4
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
    logging:
      driver: "json-file"
      options:
        max-size: "1m"
        max-file: "1"

volumes:
  searxng-cache:
  qdrant-storage:
  hf-cache:
