# /etc/fail2ban/filter.d/musix-auth.conf
# Ловит перебор паролей на логине и попытки перехватить bootstrap инстанса,
# читая access-лог nginx (стандартный combined-формат).
[Definition]
failregex = ^<HOST> - \S+ \[[^]]+\] "POST /api/v1/auth/login HTTP/[0-9.]+" 401
            ^<HOST> - \S+ \[[^]]+\] "POST /api/v1/instance/setup HTTP/[0-9.]+" (401|409)
# В конфигах fail2ban % — служебный символ интерполяции и экранируется удвоением.
datepattern = %%d/%%b/%%Y:%%H:%%M:%%S %%z
ignoreregex =
