# /etc/fail2ban/jail.d/musix.conf
# 8 неудачных логинов за 10 минут -> бан IP на час.
[musix-auth]
enabled  = true
filter   = musix-auth
logpath  = /var/log/nginx/access.log
maxretry = 8
findtime = 10m
bantime  = 1h
port     = http,https

# Заодно защита самого SSH VPS от переборов (стандартный jail fail2ban).
[sshd]
enabled  = true
maxretry = 5
bantime  = 1h
